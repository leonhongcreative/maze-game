<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="screen-orientation" content="portrait" />
<title>木盒迷宫</title>
<link rel="icon" href="data:,">
<style>
  /* UI notes, from a short pass over current references (not a visual clone):
     Apple HIG / WWDC24 "Design advanced games": one material layer for controls,
     safe areas, 44×44pt targets, body text ≥17pt and secondary ≥11pt, Reduce Motion
     replaces movement with fades. HIG Materials: do not stack a material on a material.
     Partii game UI: HUD is glanceable, kept to the edges, hints fade. Lattice: hairlines
     and one accent, the board owns the screen. Flomob settings: volume is a slider,
     on/off is a toggle, and there is always a way back. */
  :root {
    --accent: #e8b060;
    --accent-ink: #2a1608;
    --text: #f4efe8;
    --text-dim: rgba(244, 239, 232, .72);
    --text-faint: rgba(244, 239, 232, .56);
    --sheet: rgba(16, 15, 14, .94);
    --hud: rgba(10, 10, 12, .46);
    --scrim: rgba(6, 7, 10, .46);
    --hairline: rgba(255, 255, 255, .16);
    --pad: 16px;
    --tap: 44px;
    --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
    --ease: cubic-bezier(.32, .72, 0, 1);
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05040c;
    position: fixed; inset: 0;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    color: var(--text);
    font-family: var(--font);
  }
  canvas { display: block; touch-action: none; outline: none; width: 100%; height: 100%; }
  .ui { font-family: var(--font); -webkit-tap-highlight-color: transparent; }
  button, input { font-family: inherit; }
  [hidden] { display: none !important; }

  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) var(--pad) 0;
    pointer-events: none;
    color: var(--text);
  }
  .cluster {
    background: var(--hud);
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    backdrop-filter: blur(18px) saturate(1.15);
    border-radius: 14px;
    padding: 8px 12px 9px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  }
  .kicker {
    margin: 0;
    font-size: 12px; font-weight: 500; line-height: 1.3;
    color: var(--text-dim);
  }
  #levelLabel {
    margin: 1px 0 0;
    font-size: 17px; font-weight: 650; line-height: 1.25;
    font-variant-numeric: tabular-nums;
  }
  #legend {
    display: flex; gap: 10px; align-items: center;
    margin-top: 6px;
  }
  #legend[hidden] { display: none !important; }
  .key {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; line-height: 1;
    color: var(--text);
  }
  .key i {
    width: 22px; height: 14px; border-radius: 3px;
    display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
  }
  .key.rough i {
    background-color: rgba(198, 206, 214, .55);
    background-image:
      repeating-linear-gradient(45deg, rgba(18, 20, 24, .8) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-45deg, rgba(18, 20, 24, .8) 0 1px, transparent 1px 4px);
  }
  .key.slick i {
    background-color: rgba(232, 242, 252, .72);
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.95) 0 2px, transparent 2px 6px);
  }
  .hud-right { text-align: right; min-width: 92px; }
  .lives-row {
    display: flex; justify-content: flex-end; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; color: var(--text-dim); line-height: 1;
  }
  .pips { display: inline-flex; gap: 4px; }
  .pip {
    width: 10px; height: 10px; border-radius: 50%;
    background: #e25b68;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.25);
  }
  .pip.off { background: rgba(244, 239, 232, .22); box-shadow: none; }
  #timeLabel {
    margin-top: 4px;
    font-size: 17px; font-weight: 650; line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }

  .chip {
    position: fixed; z-index: 6; pointer-events: auto;
    min-height: var(--tap); min-width: var(--tap);
    padding: 0 16px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--hud); color: var(--text);
    border: 0; border-radius: 14px;
    font-size: 15px; font-weight: 600; line-height: 1;
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    backdrop-filter: blur(18px) saturate(1.15);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
    cursor: pointer;
  }
  .chip:active { transform: scale(.98); }
  #settingsBtn { left: var(--pad); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  #calibrate { right: var(--pad); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: none; }
  #hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    text-align: center; color: var(--text);
    font-size: 13px; line-height: 1.4; font-weight: 500;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
    pointer-events: none; z-index: 5;
    padding: 0 88px;
  }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: flex-end; justify-content: center;
    background: var(--scrim);
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  #overlay.hidden { display: none; }
  .card {
    width: min(100%, 420px);
    background: var(--sheet);
    border-radius: 16px;
    padding: 28px 24px 20px;
    color: var(--text);
    text-align: left;
    box-shadow: 0 18px 50px rgba(0,0,0,.32);
  }
  .card h1 {
    margin: 0;
    font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: 0;
  }
  .card .sub {
    margin: 8px 0 0;
    font-size: 17px; font-weight: 400; line-height: 1.45;
    color: var(--text-dim);
  }
  .card .stat {
    margin: 16px 0 0;
    font-size: 22px; font-weight: 650; line-height: 1.3;
    font-variant-numeric: tabular-nums;
  }
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: var(--tap);
    margin-top: 20px;
    appearance: none; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 17px; line-height: 1.2;
    border-radius: 12px;
    padding: 0 16px;
  }
  .btn:active { transform: scale(.99); }
  .btn.ghost {
    margin-top: 4px;
    background: transparent; color: var(--text);
    font-weight: 600;
  }
  .btn.ghost:active { background: rgba(255,255,255,.06); }

  #sheetBak {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.4);
    opacity: 0; pointer-events: none;
  }
  #sheetBak.open { opacity: 1; pointer-events: auto; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--sheet);
    color: var(--text);
    border-radius: 16px 16px 0 0;
    padding: 8px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -10px 40px rgba(0,0,0,.28);
    transform: translateY(105%);
    pointer-events: none;
    max-height: min(78vh, 640px);
    overflow-y: auto;
  }
  #sheet.open {
    transform: translateY(0);
    pointer-events: auto;
  }
  #sheet .handle {
    width: 36px; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,.28);
    margin: 4px auto 8px;
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    min-height: var(--tap);
    margin: 0 0 4px;
  }
  .sheet-head h2 {
    margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2;
  }
  #sheetClose {
    appearance: none; background: none; border: 0; color: var(--accent);
    font-size: 17px; font-weight: 600; cursor: pointer;
    min-height: var(--tap); min-width: var(--tap);
    padding: 0 4px;
  }
  .section {
    margin: 8px 0 0;
    padding-top: 12px;
    border-top: 1px solid var(--hairline);
  }
  .section h3 {
    margin: 0 0 8px;
    font-size: 13px; font-weight: 600; line-height: 1.3;
    color: var(--text-faint);
  }
  .swatch-row { display: flex; gap: 4px; margin: 0; }
  .swatch {
    appearance: none; border: 0; background: none; color: inherit;
    flex: 1; min-width: var(--tap); min-height: 64px;
    padding: 4px 0; cursor: pointer; text-align: center;
  }
  .swatch .dot {
    display: block; width: 28px; height: 28px; border-radius: 50%;
    margin: 0 auto 4px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .swatch.on .dot { box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px var(--accent); }
  .swatch .sw-lab { display: block; font-size: 11px; line-height: 1.2; color: var(--text-dim); }
  .swatch.on .sw-lab { color: var(--text); font-weight: 650; }
  .mchip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .mchip {
    appearance: none; cursor: pointer;
    min-height: var(--tap); padding: 0 14px;
    background: rgba(255,255,255,.08); color: var(--text);
    border: 0; border-radius: 12px;
    font-size: 15px; font-weight: 500;
  }
  .mchip.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .vol-row {
    display: flex; align-items: center; gap: 12px;
    min-height: var(--tap);
    font-size: 15px; font-weight: 500;
  }
  .vol-row input[type=range] { flex: 1; min-height: var(--tap); accent-color: var(--accent); }
  .check {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: var(--tap); min-width: var(--tap);
    font-size: 15px; font-weight: 500;
  }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); }

  @media (prefers-reduced-motion: no-preference) {
    #sheet { transition: transform .34s var(--ease); }
    #sheetBak { transition: opacity .22s ease; }
    #hint { transition: opacity .35s ease; }
    .chip:active, .btn:active { transition: transform .12s ease; }
    .swatch .dot { transition: box-shadow .16s ease; }
    #overlay .card { animation: cardIn .32s var(--ease); }
    #levelLabel.tick { animation: levelIn .28s ease; }
    .pip.just { animation: pipOut .36s ease; }
  }
  @media (prefers-reduced-motion: reduce) {
    #sheet, #sheetBak, #hint, .card, .pip, #levelLabel, .swatch .dot, .chip, .btn {
      transition: none !important;
      animation: none !important;
    }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes levelIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pipOut {
    0% { transform: scale(1); }
    40% { transform: scale(.4); opacity: .4; }
    100% { transform: none; opacity: 1; }
  }
  @media (max-width: 360px) {
    .card h1 { font-size: 24px; }
    #levelLabel, #timeLabel { font-size: 16px; }
  }
</style>

<body>
<div id="hud" class="ui">
  <div class="cluster">
    <p class="kicker">木盒迷宫</p>
    <p id="levelLabel">第 1 关</p>
    <div id="legend" hidden>
      <span class="key rough"><i></i>涩</span>
      <span class="key slick"><i></i>滑</span>
    </div>
  </div>
  <div class="cluster hud-right">
    <div class="lives-row">生命 <span class="pips" id="pips" aria-hidden="true"></span></div>
    <div id="timeLabel">0.0 秒</div>
  </div>
</div>
<button class="ui chip" id="settingsBtn" type="button" aria-expanded="false" aria-controls="sheet">设置</button>
<button class="ui chip" id="calibrate" type="button">校准水平</button>
<div id="hint" class="ui">倾斜木盒，滚向出口。外墙开口会坠入星空。</div>
<div id="sheetBak"></div>
<div id="sheet" class="ui" role="dialog" aria-label="设置" aria-modal="true" aria-hidden="true">
  <div class="handle"></div>
  <div class="sheet-head">
    <h2>设置</h2>
    <button type="button" id="sheetClose">完成</button>
  </div>
  <section class="section">
    <h3>主题</h3>
    <div class="swatch-row" id="sheetSwatches"></div>
  </section>
  <section class="section">
    <h3>声音</h3>
    <div class="mchip-row" id="musicChips"></div>
    <div class="vol-row"><span>音乐</span><input type="range" id="musicVol" min="0" max="1" step="0.01" value="0.45" aria-label="音乐音量"></div>
    <label class="check"><input type="checkbox" id="sfxOn" checked>音效 <span id="sfxOnLab">开</span></label>
    <div class="vol-row"><span>音效</span><input type="range" id="sfxVol" min="0" max="1" step="0.01" value="0.7" aria-label="音效音量"></div>
  </section>
</div>
<div id="overlay" class="ui">
  <div class="card" id="card">
    <h1 id="cardTitle">木盒迷宫</h1>
    <p class="sub" id="cardSub">倾斜木盒，让小球滚进出口。外墙有开口，掉下去会坠入星空。每局 3 条生命。</p>
    <div class="stat" id="cardStat" hidden></div>
    <button class="btn" id="startBtn" type="button">开始游戏</button>
    <button class="btn ghost" id="settingsAlt" type="button">主题与声音</button>
    <button class="btn ghost" id="nextBtn" type="button" hidden>下一关</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* --------------------------------------------------------------------------
 * 设备倾斜输入适配器
 * 当前：浏览器 DeviceOrientationEvent
 *   - iOS 必须在用户手势里调用 DeviceOrientationEvent.requestPermission()
 *   - 页面必须通过 HTTPS 访问（可用 GitHub Pages 等托管）
 *   - 微信 iOS 内置浏览器同样支持，前提也是 HTTPS + 用户手势授权
 * 微信小游戏日后可替换为：
 *   wx.startDeviceMotionListening({ interval: 'game' })
 *   wx.onDeviceMotionChange(({ alpha, beta, gamma }) => applyDeviceTilt(beta, gamma))
 *   wx.stopDeviceMotionListening()
 * 两边都提供 beta（前后，度）/ gamma（左右，度），下面的校准、死区、平滑与映射可原样复用。
 * -------------------------------------------------------------------------- */

const clamp = THREE.MathUtils.clamp;
const degToRad = THREE.MathUtils.degToRad;
const damp = (c, t, l, dt) => c + (t - c) * (1 - Math.exp(-l * dt));

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040c);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 80);
scene.add(camera);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const hemi = new THREE.HemisphereLight(0xc8d4f0, 0x12101c, 0.42);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe0b0, 2.15);
key.position.set(4.5, 8.5, 3.2);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1;
key.shadow.camera.far = 28;
key.shadow.bias = -0.0008;
key.shadow.normalBias = 0.03;
scene.add(key);
const fill = new THREE.DirectionalLight(0x7a8cb8, 0.32);
fill.position.set(-5, 3, -4);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x6a7fb8, 0.28);
rim.position.set(-3.2, 2.2, -5.5);
scene.add(rim);

// Deep-space backdrop + shared GLSL used by the liquid-glass floor.
// Sit at the far plane so the tilting board never clips against it.
const SPACE_GLSL = `
    float hash13(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }
    float vnoise(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float n000 = hash13(i);
      float n100 = hash13(i + vec3(1.0, 0.0, 0.0));
      float n010 = hash13(i + vec3(0.0, 1.0, 0.0));
      float n110 = hash13(i + vec3(1.0, 1.0, 0.0));
      float n001 = hash13(i + vec3(0.0, 0.0, 1.0));
      float n101 = hash13(i + vec3(1.0, 0.0, 1.0));
      float n011 = hash13(i + vec3(0.0, 1.0, 1.0));
      float n111 = hash13(i + vec3(1.0, 1.0, 1.0));
      float nx00 = mix(n000, n100, f.x);
      float nx10 = mix(n010, n110, f.x);
      float nx01 = mix(n001, n101, f.x);
      float nx11 = mix(n011, n111, f.x);
      return mix(mix(nx00, nx10, f.y), mix(nx01, nx11, f.y), f.z);
    }
    float fbm(vec3 p) {
      float a = 0.0, w = 0.5;
      for (int i = 0; i < 5; i++) {
        a += w * vnoise(p);
        p = p * 2.07 + 1.37;
        w *= 0.5;
      }
      return a;
    }
    mat2 rot(float a) {
      float c = cos(a), s = sin(a);
      return mat2(c, -s, s, c);
    }
    vec3 softStars(vec3 dir, float density, float radius, float bright) {
      vec3 p = dir * density;
      vec3 i0 = floor(p);
      vec3 acc = vec3(0.0);
      for (int z = -1; z <= 1; z++)
      for (int y = -1; y <= 1; y++)
      for (int x = -1; x <= 1; x++) {
        vec3 cell = i0 + vec3(float(x), float(y), float(z));
        float h = hash13(cell);
        if (h > 0.9) {
          vec3 sp = cell + vec3(hash13(cell + 1.1), hash13(cell + 2.3), hash13(cell + 3.7));
          float d = length(p - sp);
          float s = exp(-d * d / max(radius * radius, 1e-5));
          vec3 tint = mix(vec3(0.65, 0.82, 1.0), vec3(1.0, 0.9, 0.72), hash13(cell + 9.0));
          acc += tint * s * bright * (0.45 + h);
        }
      }
      return acc;
    }
    vec3 spaceColor(vec3 d, float time) {
      d = normalize(d);
      float t = time * 0.008;
      vec3 d1 = d;
      d1.xz = rot(t) * d1.xz;
      vec3 d2 = d;
      d2.xy = rot(t * 0.55 + 0.4) * d2.xy;
      float n  = fbm(d1 * 2.15);
      float n2 = fbm(d2 * 3.8 + 8.0);
      float n3 = fbm(d1 * 1.05 + n * 0.85);
      vec3 col = vec3(0.010, 0.012, 0.028);
      col += vec3(0.16, 0.045, 0.20) * smoothstep(0.42, 0.88, n3) * 0.75;
      col += vec3(0.02, 0.10, 0.16) * smoothstep(0.38, 0.82, n2) * 0.55;
      col += vec3(0.12, 0.035, 0.04) * smoothstep(0.55, 0.92, n) * 0.40;
      col *= 0.50 + 0.50 * smoothstep(0.18, 0.72, n2);
      col += softStars(d1, 28.0, 0.42, 0.55);
      col += softStars(d2, 64.0, 0.22, 0.70);
      col += softStars(d1.yzx, 130.0, 0.10, 0.40);
      return col;
    }
`;

const spaceMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  depthTest: false,
  fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      mat4 viewRot = mat4(mat3(modelViewMatrix));
      vec4 clip = projectionMatrix * viewRot * vec4(position, 1.0);
      gl_Position = clip.xyww;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    varying vec3 vDir;
    ${SPACE_GLSL}
    void main() {
      gl_FragColor = vec4(spaceColor(normalize(vDir), uTime), 1.0);
    }
  `
});
const spaceMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), spaceMat);
spaceMesh.name = 'space';
spaceMesh.frustumCulled = false;
spaceMesh.renderOrder = -1000;
scene.add(spaceMesh);

const board = new THREE.Group();
board.name = 'board';
scene.add(board);

// ---------- wood textures ----------
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) {
  let a = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 5; i++) { a += amp * noise2(x * f, y * f); f *= 2; amp *= 0.5; }
  return a;
}
function makeWoodTexture({ w = 512, h = 512, c0 = [0x8b, 0x57, 0x2e], c1 = [0x4a, 0x2a, 0x14], rings = 14, repeatX = 1, repeatY = 1, straight = false } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const n = fbm(nx * (straight ? 2.2 : 6), ny * (straight ? 28 : 18));
      const n2 = fbm(nx * (straight ? 8 : 22), ny * (straight ? 40 : 3.5));
      const wave = Math.sin((nx * rings + n * (straight ? 0.7 : 2.4) + ny * (straight ? 0.08 : 0.4)) * Math.PI * 2) * 0.5 + 0.5;
      const v = clamp(wave * 0.72 + n2 * 0.22 + 0.12, 0, 1);
      const i = (y * w + x) * 4;
      d[i]     = clamp(c0[0] + (c1[0] - c0[0]) * (1 - v) * 0.85 + (n - 0.5) * 18, 0, 255) | 0;
      d[i + 1] = clamp(c0[1] + (c1[1] - c0[1]) * (1 - v) * 0.85 + (n - 0.5) * 12, 0, 255) | 0;
      d[i + 2] = clamp(c0[2] + (c1[2] - c0[2]) * (1 - v) * 0.85 + (n - 0.5) * 8, 0, 255) | 0;
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  tex.repeat.set(repeatX, repeatY);
  tex.needsUpdate = true;
  return tex;
}

    uniform float uTime;
    uniform vec3 uLightDir;
    uniform vec2 uHalf;
    uniform vec3 uBoardX;
    uniform vec3 uBoardZ;
    uniform vec3 uTint;
    uniform vec3 uWash;
    uniform float uWashAmt;
    uniform vec3 uFres;
    uniform vec3 uRim;
    uniform vec3 uRimCore;
    uniform vec2 uHolePos;
    uniform float uHoleR;
    uniform sampler2D uSurf;
    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    varying vec3 vLocalPos;
    varying vec3 vLocalNormal;
    ${SPACE_GLSL}

    void main() {
      vec3 I = normalize(vWorldPos - cameraPosition);
      vec3 N = normalize(vWorldNormal);
      if (dot(N, -I) < 0.0) N = -N;

      vec3 bx = normalize(uBoardX);
      vec3 bz = normalize(uBoardZ);
      vec2 lp = vec2(vLocalPos.x / max(uHalf.x, 1e-4), vLocalPos.z / max(uHalf.y, 1e-4));

      vec2 hdelta = vLocalPos.xz - uHolePos;
      float hdist = length(hdelta);
      float ht = hdist / max(uHoleR, 1e-4);
      if (ht < 1.0) {
        float warp = 0.42 * ht * (1.0 - ht) * (1.0 - ht);
        vec2 hdir = hdelta / max(hdist, 1e-5);
        rd = normalize(rd + (bx * hdir.x + bz * hdir.y) * warp);

      float az = 1.0 - abs(lp.y);

      float rimSoft = 1.0 - smoothstep(0.0, 0.080, dEdge);

      float isSide = smoothstep(0.5, 0.8, 1.0 - abs(vLocalNormal.y));

      col += vec3(0.78, 0.90, 1.0) * pow(nh, 14.0) * 0.16;

      vec2 suv = vec2(vLocalPos.x / (uHalf.x * 2.0) + 0.5, vLocalPos.z / (uHalf.y * 2.0) + 0.5);

        float h2 = abs(fract((fp.x - fp.y) * 26.0) - 0.5);

        float streak = smoothstep(0.28, 0.42, lane);
        float groove = 1.0 - smoothstep(0.08, 0.2, lane);

        col = mix(col, slickCol, clamp(slickW, 0.0, 1.0));
      }

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

function canvasTex(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  fn(img.data, w, h);
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  tex.needsUpdate = true;
  return tex;
}
function makeMarbleTexture() {
  return canvasTex(512, 512, (d, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const n = fbm(nx * 3.2 + 2.0 * fbm(nx * 1.4, ny * 1.8), ny * 4.5);
      const v1 = Math.abs(Math.sin((nx * 2.2 + n * 1.8 + ny * 0.35) * Math.PI * 2));
      const v2 = Math.abs(Math.sin((ny * 3.1 - n * 2.2 + nx * 0.7) * Math.PI * 3.2));
      const vein = Math.pow(Math.min(v1, v2 * 0.85 + 0.15), 4.2);
      const cloud = fbm(nx * 5.0, ny * 6.0);
      const body = 208 + (cloud - 0.5) * 22;
      const g = clamp(body - vein * 145, 0, 255);
      const i = (y * w + x) * 4;
      d[i] = clamp(g + 6, 0, 255); d[i + 1] = clamp(g + 1, 0, 255); d[i + 2] = clamp(g - 4, 0, 255); d[i + 3] = 255;
    }
  });
}
function makeBrushedTexture() {
  return canvasTex(512, 256, (d, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const streak = fbm(nx * 28, ny * 1.15);
      const fine = fbm(nx * 70, ny * 3.2);
      const v = clamp(0.28 + streak * 0.48 + (fine - 0.5) * 0.16, 0, 1);
      const i = (y * w + x) * 4;
      d[i]     = (78 + v * 70) | 0;
      d[i + 1] = (86 + v * 74) | 0;
      d[i + 2] = (96 + v * 78) | 0;
      d[i + 3] = 255;
    }
  });
}
function makePearlTexture() {
  return canvasTex(256, 256, (d, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const n = fbm(nx * 3.5, ny * 3.5);
      const n2 = fbm(nx * 9, ny * 8);
      const band = 0.5 + 0.5 * Math.sin((nx * 5.5 + ny * 1.8 + n * 1.6) * Math.PI * 2);
      const v = 0.78 + n * 0.16 + (n2 - 0.5) * 0.08;
      const i = (y * w + x) * 4;
      d[i]     = clamp(230 * v + band * 28, 0, 255) | 0;
      d[i + 1] = clamp(214 * v + 18 + (1.0 - band) * 16, 0, 255) | 0;
      d[i + 2] = clamp(220 * v + 22 + band * 10, 0, 255) | 0;
      d[i + 3] = 255;
    }
  });
}
function makeJadeTexture() {
  return canvasTex(512, 512, (d, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const cloud = fbm(nx * 3.2, ny * 3.8);
      const n = fbm(nx * 2.0 + cloud, ny * 5.5);
      const vein = Math.pow(Math.abs(Math.sin((nx * 1.6 + n * 2.4 + ny * 0.9) * Math.PI * 3)), 5.5);
      const ice = Math.pow(Math.max(0, cloud - 0.62), 1.4);
      const r = clamp(18 + cloud * 36 + vein * 70 + ice * 90, 0, 255);
      const g = clamp(78 + cloud * 70 - vein * 20 + ice * 50, 0, 255);
      const b = clamp(48 + cloud * 28 - vein * 8 + ice * 30, 0, 255);
      const i = (y * w + x) * 4;
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
    }
  });
}

      vec3 body = vec3(0.03, 0.20, 0.07);
      vec3 jade = mix(deep, body, clamp(pow(thin, 0.8), 0.0, 1.0));
      jade += vec3(0.04, 0.10, 0.025) * wrap * (0.35 + 0.65 * thin);
      jade += vec3(0.10, 0.22, 0.05) * trans * back * 0.45;
      float sss = pow(clamp(dot(normalize(V), -L) * 0.5 + 0.5, 0.0, 1.0), 1.6);
      jade += vec3(0.05, 0.14, 0.03) * sss * thin * 0.35;

      vec3 refr = refract(-V, N, 1.0 / 1.62);
      if (dot(refr, refr) < 1e-5) refr = reflect(-V, N);
      vec3 env = spaceColor(refr, uTime);
      float see = clamp(thin * 0.28, 0.0, 0.18);
      jade = mix(jade, env * vec3(0.25, 0.55, 0.32) + jade, see);

      vec3 H = normalize(L + V);
      float spec = pow(max(dot(N, H), 0.0), 180.0);
      float specW = pow(max(dot(N, H), 0.0), 24.0);
      float face = smoothstep(0.08, 0.45, max(dot(N, V), 0.0));
      jade += vec3(0.85, 0.95, 0.7) * spec * 0.22 * (0.35 + 0.65 * face);
      jade += vec3(0.28, 0.48, 0.22) * specW * 0.04;

      // Simulated caustics: analytic moving interference, stronger where the stone transmits.
      // This is not a ray-traced light transport pass.
      float c1 = sin(vBox.x * 18.0 + vBox.y * 11.0 + uTime * 1.25);
      float c2 = sin(vBox.z * 16.0 - vBox.y * 9.0 - uTime * 0.95 + 1.4);
      float c3 = sin((vBox.x + vBox.z) * 12.0 + vBox.y * 7.0 + uTime * 0.45);
      float cau = pow(clamp(0.55 + 0.45 * c1 * c2 + 0.25 * c3, 0.0, 1.0), 3.2);
      jade += vec3(0.12, 0.28, 0.06) * cau * thin * face * (0.45 + 0.55 * wrap);

      float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
      jade += vec3(0.25, 0.42, 0.22) * fres * 0.08;
      float foot = smoothstep(0.02, vHalf.y, vBox.y + vHalf.y);
      jade *= mix(0.78, 1.0, foot);
      gl_FragColor = vec4(jade, 1.0);
    }
  `
});

function loadAudioSettings() {
  try {

    if (s.musicId && MUSIC_OPTS.some((o) => o.id === s.musicId)) audio.musicId = s.musicId;

    if (typeof s.sfxOn === 'boolean') audio.sfxOn = s.sfxOn;
    if (typeof s.sfxVol === 'number') audio.sfxVol = clamp(s.sfxVol, 0, 1);
  } catch (e) {}
}
function saveAudioSettings() {
  try {
    localStorage.setItem('maze.audio', JSON.stringify({
      musicId: audio.musicId, musicVol: audio.musicVol, sfxOn: audio.sfxOn, sfxVol: audio.sfxVol
    }));
  } catch (e) {}
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audio.ctx) {
    audio.ctx = new AC();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = 1;
    audio.master.connect(audio.ctx.destination);
    audio.musicGain = audio.ctx.createGain();
    audio.musicGain.gain.value = audio.musicVol;
    audio.musicGain.connect(audio.master);
    audio.sfxGain = audio.ctx.createGain();
    audio.sfxGain.gain.value = audio.sfxOn ? audio.sfxVol : 0;
    audio.sfxGain.connect(audio.master);
    const n = Math.floor(audio.ctx.sampleRate * 1.5);
    const buf = audio.ctx.createBuffer(1, n, audio.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let b = 0;
    for (let i = 0; i < n; i++) { b = 0.97 * b + 0.03 * (Math.random() * 2 - 1); d[i] = b * 3.2; }
    audio.noiseBuf = buf;
  }
  return audio.ctx;
}

function unlockAudio() {
  const ctx = ensureAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  if (!audio.unlocked) {
    audio.unlocked = true;
    startMusic(audio.musicId);
  }
}

function setMusicVol(v) {
  audio.musicVol = clamp(v, 0, 1);
  if (audio.musicGain) audio.musicGain.gain.setTargetAtTime(audio.musicVol, audio.ctx.currentTime, 0.04);
  saveAudioSettings();
}
function setSfxVol(v) {
  audio.sfxVol = clamp(v, 0, 1);
  if (audio.sfxGain) audio.sfxGain.gain.setTargetAtTime(audio.sfxOn ? audio.sfxVol : 0, audio.ctx.currentTime, 0.04);
  saveAudioSettings();
}
function setSfxOn(on) {
  audio.sfxOn = !!on;
  if (audio.sfxGain) audio.sfxGain.gain.setTargetAtTime(audio.sfxOn ? audio.sfxVol : 0, audio.ctx.currentTime, 0.04);
  saveAudioSettings();
  syncAudioUI();
}

function stopMusic() {
  if (audio.musicStop) { try { audio.musicStop(); } catch (e) {} }
  audio.musicStop = null;
  for (const n of audio.musicNodes) {
    try { n.stop?.(); } catch (e) {}
    try { n.disconnect?.(); } catch (e) {}
  }
  audio.musicNodes = [];
}

function addNode(n) { audio.musicNodes.push(n); return n; }

function startMusic(id) {
  audio.musicId = id || 'off';
  saveAudioSettings();
  syncAudioUI();
  if (!audio.unlocked || !audio.ctx) return;
  stopMusic();
  if (audio.musicId === 'off') return;
  const ctx = audio.ctx;
  const out = audio.musicGain;
  const now = ctx.currentTime;
  let stopped = false;
  const stops = [];

  function noiseSrc() {
    const s = ctx.createBufferSource();
    s.buffer = audio.noiseBuf;
    s.loop = true;
    addNode(s);
    return s;
  }

  if (id === 'space') {
    const makePad = (freq, type, gain) => {
      const o = ctx.createOscillator();
      o.type = type; o.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = gain;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07 + Math.random() * 0.05;
      const lg = ctx.createGain(); lg.gain.value = 220;
      lfo.connect(lg); lg.connect(f.frequency);
      o.connect(f); f.connect(g); g.connect(out);
      o.start(); lfo.start();
      addNode(o); addNode(g); addNode(f); addNode(lfo);
    };
    makePad(55, 'sine', 0.10);
    makePad(82.4, 'sine', 0.07);
    makePad(164.8, 'triangle', 0.035);
    const ns = noiseSrc();
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = 0.7;
    const ng = ctx.createGain(); ng.gain.value = 0.025;
    ns.connect(nf); nf.connect(ng); ng.connect(out); ns.start();
    addNode(nf); addNode(ng);
  } else if (id === 'lofi') {
    const pad = ctx.createOscillator(); pad.type = 'sine'; pad.frequency.value = 110;
    const pg = ctx.createGain(); pg.gain.value = 0.04;
    pad.connect(pg); pg.connect(out); pad.start(); addNode(pad); addNode(pg);
    const beat = 0.5;
    const notes = [0, 3, 7, 10, 7, 3, 0, 5];
    let step = 0;
    const sched = () => {
      if (stopped) return;
      const t0 = ctx.currentTime;
      for (let i = 0; i < 8; i++) {
        const t = t0 + i * beat;
        // kick
        const k = ctx.createOscillator(); k.type = 'sine';
        const kg = ctx.createGain();
        k.frequency.setValueAtTime(140, t);
        k.frequency.exponentialRampToValueAtTime(42, t + 0.1);
        kg.gain.setValueAtTime(0.16, t);
        kg.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        k.connect(kg); kg.connect(out); k.start(t); k.stop(t + 0.2);
        // hat on offbeats
        const hs = ctx.createBufferSource(); hs.buffer = audio.noiseBuf;
        const hf = ctx.createBiquadFilter(); hf.type = 'highpass'; hf.frequency.value = 6000;
        const hg = ctx.createGain();
        const ht = t + beat * 0.5;
        hg.gain.setValueAtTime(0.045, ht);
        hg.gain.exponentialRampToValueAtTime(0.001, ht + 0.06);
        hs.connect(hf); hf.connect(hg); hg.connect(out); hs.start(ht); hs.stop(ht + 0.07);
        // arp
        const n = notes[(step + i) % notes.length];
        const a = ctx.createOscillator(); a.type = 'triangle';
        a.frequency.value = 220 * Math.pow(2, n / 12);
        const ag = ctx.createGain();
        const at = t + 0.02;
        ag.gain.setValueAtTime(0.05, at);
        ag.gain.exponentialRampToValueAtTime(0.001, at + 0.28);
        const lf = ctx.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 1400;
        a.connect(lf); lf.connect(ag); ag.connect(out); a.start(at); a.stop(at + 0.3);
      }
      step += 8;
      audio.musicTimer = setTimeout(sched, beat * 8 * 1000 - 40);
    };
    sched();
    stops.push(() => clearTimeout(audio.musicTimer));
  } else if (id === 'piano') {
    const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19];
    const playNote = (freq, t, dur, amp) => {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g.connect(out);
      [1, 2, 3].forEach((h, i) => {
        const o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.value = freq * h;
        const hg = ctx.createGain(); hg.gain.value = [1, 0.32, 0.12][i];
        o.connect(hg); hg.connect(g); o.start(t); o.stop(t + dur + 0.05);
      });
    };
    const tick = () => {
      if (stopped) return;
      const t = ctx.currentTime + 0.05;
      const n = scale[(Math.random() * scale.length) | 0];
      playNote(261.63 * Math.pow(2, n / 12) * 0.5, t, 1.8 + Math.random(), 0.11);
      if (Math.random() < 0.4) {
        playNote(261.63 * Math.pow(2, (n + 4) / 12) * 0.5, t + 0.03, 1.5, 0.06);
      }
      audio.musicTimer = setTimeout(tick, 900 + Math.random() * 1300);
    };
    tick();
    stops.push(() => clearTimeout(audio.musicTimer));
  } else if (id === 'nature') {
    const wind = noiseSrc();
    const wf = ctx.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 380;
    const wg = ctx.createGain(); wg.gain.value = 0.11;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.12;
    const lg = ctx.createGain(); lg.gain.value = 140;
    lfo.connect(lg); lg.connect(wf.frequency);
    wind.connect(wf); wf.connect(wg); wg.connect(out);
    wind.start(); lfo.start();
    addNode(wf); addNode(wg); addNode(lfo);
    const rainTick = () => {
      if (stopped) return;
      const t = ctx.currentTime;
      const s = ctx.createBufferSource(); s.buffer = audio.noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.03 + Math.random() * 0.03, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      s.connect(f); f.connect(g); g.connect(out);
      s.start(t); s.stop(t + 0.06);
      audio.musicTimer = setTimeout(rainTick, 40 + Math.random() * 90);
    };
    rainTick();
    stops.push(() => clearTimeout(audio.musicTimer));
  }

  audio.musicStop = () => { stopped = true; stops.forEach((fn) => fn()); };
}

function sfxOut() { return audio.unlocked && audio.ctx && audio.sfxOn ? audio.sfxGain : null; }

function playClick() {
  const out = sfxOut(); if (!out) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 1400;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.05);
}

    o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t + 0.1);
  } else if (theme === 'pearl') {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 1100;

function updateRollSound(speed) {
  if (!audio.unlocked || !audio.ctx || !audio.sfxOn) {
    if (audio.roll) audio.roll.gain.gain.setTargetAtTime(0, audio.ctx ? audio.ctx.currentTime : 0, 0.08);
    return;
  }
  const ctx = audio.ctx;
  if (!audio.roll) {
    const src = ctx.createBufferSource(); src.buffer = audio.noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 1.2;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(audio.sfxGain);
    src.start();
    audio.roll = { src, filter: f, gain: g };
  }
  const amt = clamp((speed - 0.15) / 5.2, 0, 1);
  audio.roll.gain.gain.setTargetAtTime(amt * 0.16, ctx.currentTime, 0.06);
  audio.roll.filter.frequency.setTargetAtTime(380 + amt * 720, ctx.currentTime, 0.06);
}

// ---------- maze generation (recursive backtracker) ----------
function generateMaze(cols, rows) {
  const cells = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => ({ n: true, s: true, e: true, w: true }))
  );
  const vis = Array.from({ length: rows }, () => Array(cols).fill(false));
  const stack = [[0, 0]];
  vis[0][0] = true;
  const dirs = [
    [0, -1, 'n', 's'],
    [0,  1, 's', 'n'],
    [1,  0, 'e', 'w'],
    [-1, 0, 'w', 'e']
  ];
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const opts = [];
    for (const [dx, dy, a, b] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && !vis[ny][nx]) opts.push([nx, ny, a, b]);
    }
    if (!opts.length) { stack.pop(); continue; }
    const [nx, ny, a, b] = opts[(Math.random() * opts.length) | 0];
    cells[y][x][a] = false;
    cells[ny][nx][b] = false;
    vis[ny][nx] = true;
    stack.push([nx, ny]);
  }
  return cells;
}

function sizeForLevel(lv) {
  return Math.min(7 + (lv - 1) * 2, 15);
}
function gapCountFor(lv) {
  const max = Math.max(4, sizeForLevel(lv) * 2 - 4); // eligible edges are plentiful
  return Math.min(1 + (lv - 1), max);
}
function gapWidthFor(lv) {
  return CELL * Math.min(0.5 + (lv - 1) * 0.12, 1.4);
}
function boardExtent() {
  return { hw: cols * CELL * 0.5, hd: rows * CELL * 0.5 };
}

function cellCenter(i, j) {
  const ox = (cols - 1) * CELL * 0.5;
  const oz = (rows - 1) * CELL * 0.5;
  return new THREE.Vector3(i * CELL - ox, RADIUS, j * CELL - oz);
}

function addBox(minX, maxX, minZ, maxZ, rf) {
