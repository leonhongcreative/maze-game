<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="screen-orientation" content="portrait" />
<title>木盒迷宫</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --accent: #e8b060;
    --accent2: #c4842e;
    --accent-ink: #2a1608;
    --accent-shadow: #8a5a18;
    --card-top: rgba(72,42,24,.92);
    --card-bot: rgba(36,22,12,.94);
    --text: #f6eadc;
    --sheet-bg: rgba(22,16,14,.94);
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05040c;
    position: fixed; inset: 0;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { display: block; touch-action: none; outline: none; width: 100%; height: 100%; }
  .ui {
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 0;
    color: var(--text, #f6eadc); pointer-events: none; z-index: 5;
    text-shadow: 0 1px 8px rgba(0,0,0,.55);
  }
  #hud .title { font-weight: 650; font-size: 15px; letter-spacing: .06em; }
  #hud .title small { display: block; font-weight: 400; opacity: .7; font-size: 12px; margin-top: 2px; letter-spacing: .02em; }
  #hud .hud-right { text-align: right; }
  #hud .lives { font-size: 14px; font-weight: 600; letter-spacing: .04em; margin-bottom: 3px; }
  #hud .lives .hearts { letter-spacing: .14em; color: #ff6b7a; }
  #hud .lives .hearts .off { color: rgba(246,234,220,.28); }
  #hud .time { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
  #calibrate {
    position: fixed; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    z-index: 5; pointer-events: auto;
    background: var(--sheet-bg, rgba(40,24,14,.55)); color: var(--text, #f6eadc);
    border: 1px solid rgba(246,234,220,.28); border-radius: 18px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none;
  }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    text-align: center; color: rgba(246,234,220,.82); font-size: 13px;
    text-shadow: 0 1px 6px rgba(0,0,0,.65); pointer-events: none; z-index: 5;
    padding: 0 108px; transition: opacity .6s;
  }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(12,8,5,.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  .card {
    width: min(92vw, 380px);
    background: linear-gradient(180deg, var(--card-top), var(--card-bot));
    border: 1px solid rgba(246,234,220,.22);
    border-radius: 20px;
    padding: 22px 20px 18px;
    color: var(--text, #f6eadc);
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  .card h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: .12em; font-weight: 700; }
  .card .sub { margin: 0 0 22px; font-size: 14px; line-height: 1.6; opacity: .8; }
  .card .stat { font-size: 22px; font-weight: 650; margin: 6px 0 20px; font-variant-numeric: tabular-nums; }
  .btn {
    display: block; width: 100%;
    appearance: none; border: 0; cursor: pointer;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    color: var(--accent-ink); font-weight: 700; font-size: 16px;
    padding: 13px 16px; border-radius: 14px;
    box-shadow: 0 4px 0 var(--accent-shadow), 0 8px 20px rgba(0,0,0,.28);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-shadow), 0 4px 12px rgba(0,0,0,.28); }
  [hidden] { display: none !important; }
  .btn.ghost {
    margin-top: 10px;
    background: transparent; color: var(--text, #f6eadc);
    border: 1px solid rgba(246,234,220,.3);
    box-shadow: none; font-weight: 600;
  }

  #themeBtn {
    position: fixed; left: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    z-index: 6; pointer-events: auto;
    background: rgba(16, 14, 20, .82); color: #f4efe8;
    border: 1px solid rgba(255,255,255,.32); border-radius: 18px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  #sheetBak {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.4); display: none;
  }
  #sheetBak.open { display: block; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--sheet-bg);
    color: var(--text, #f6eadc);
    border-radius: 22px 22px 0 0;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -12px 40px rgba(0,0,0,.4);
    transform: translateY(calc(100% + 72px));
    visibility: hidden;
    pointer-events: none;
    transition: transform .28s ease, visibility 0s linear .28s;
    max-height: 78vh; overflow-y: auto;
  }
  #sheet.open {
    transform: translateY(0);
    visibility: visible;
    pointer-events: auto;
    transition: transform .28s ease, visibility 0s;
  }
  #sheet .handle { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); margin: 4px auto 10px; }
  #sheet h3 { margin: 4px 0 10px; font-size: 15px; letter-spacing: .08em; font-weight: 650; display: flex; justify-content: space-between; align-items: center; }
  #sheet h3 button { appearance: none; background: none; border: 0; color: inherit; font-size: 13px; opacity: .7; cursor: pointer; }
  .swatch-row { display: flex; justify-content: space-between; gap: 6px; margin: 0 0 14px; }
  .swatch {
    appearance: none; border: 0; background: none; color: inherit;
    padding: 0; cursor: pointer; flex: 1; text-align: center;
  }
  .swatch .dot {
    display: block; width: 36px; height: 36px; border-radius: 50%;
    margin: 0 auto 5px; border: 2px solid rgba(255,255,255,.25);
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .swatch.on .dot { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,.3); }
  .swatch .sw-lab { display: block; font-size: 11px; opacity: .85; letter-spacing: .04em; }
  #startExtras { margin: 0 0 14px; }
  #startExtras .swatch .dot { width: 32px; height: 32px; }
  .audio-block label, .vol-row span { font-size: 12px; opacity: .8; }
  .mchip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .mchip {
    appearance: none; cursor: pointer;
    background: rgba(255,255,255,.08); color: inherit;
    border: 1px solid rgba(255,255,255,.16); border-radius: 14px;
    padding: 5px 10px; font-size: 12px;
  }
  .mchip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 650; }
  .vol-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .vol-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .vol-row input[type=checkbox] { accent-color: var(--accent); }
  #card .sub { margin: 0 0 12px; }
  @media (max-width: 420px) {
    #hud .title { font-size: 13px; }
    #hud .lives { font-size: 13px; }
    #hud .time { font-size: 16px; }
    .card h1 { font-size: 22px; }
  }
</style>

<body>
<div id="hud" class="ui">
  <div class="title">木盒迷宫<small id="levelLabel">第 1 关 · 难度 1</small></div>
  <div class="hud-right">
    <div class="lives" id="livesLabel">生命 <span class="hearts">❤❤❤</span></div>
    <div class="time" id="timeLabel">0.0 秒</div>
  </div>
</div>
<button class="ui" id="themeBtn">主题 / 声音</button>
<button class="ui" id="calibrate">校准水平</button>
<div id="hint" class="ui">倾斜木盒，滚向出口 · 小心外墙开口</div>
<div id="sheetBak"></div>
<div id="sheet" class="ui" role="dialog" aria-label="主题与声音">
  <div class="handle"></div>
  <h3>主题<button type="button" id="sheetClose">完成</button></h3>
  <div class="swatch-row" id="sheetSwatches"></div>
  <h3>声音</h3>
  <div class="audio-block">
    <label>音乐</label>
    <div class="mchip-row" id="musicChips"></div>
    <div class="vol-row"><span>音乐音量</span><input type="range" id="musicVol" min="0" max="1" step="0.01" value="0.45"></div>
    <div class="vol-row"><span>音效</span><input type="checkbox" id="sfxOn" checked><span id="sfxOnLab">开</span>
      <span style="margin-left:auto">音量</span><input type="range" id="sfxVol" min="0" max="1" step="0.01" value="0.7"></div>
  </div>
</div>
<div id="overlay" class="ui">
  <div class="card" id="card">
    <h1 id="cardTitle">木盒迷宫</h1>
    <p class="sub" id="cardSub">倾斜木盒，让金属小球滚向出口。外墙有开口，掉下去会坠入星空并失去一条生命。每局 3 次机会。<br>可在下方选择主题与背景音乐。</p>
    <div id="startExtras">
      <div class="swatch-row" id="startSwatches"></div>
    </div>
    <div class="stat" id="cardStat" hidden></div>
    <button class="btn" id="startBtn">开始游戏 / 启用陀螺仪</button>
    <button class="btn ghost" id="nextBtn" hidden>下一关（更大迷宫）</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* --------------------------------------------------------------------------
 * 设备倾斜输入适配器
 * 当前：浏览器 DeviceOrientationEvent
 *   - iOS 必须在用户手势里调用 DeviceOrientationEvent.requestPermission()
 *   - 页面必须通过 HTTPS 访问（可用 GitHub Pages 等托管）
 *   - 微信 iOS 内置浏览器同样支持，前提也是 HTTPS + 用户手势授权
 * 微信小游戏日后可替换为：
 *   wx.startDeviceMotionListening({ interval: 'game' })
 *   wx.onDeviceMotionChange(({ alpha, beta, gamma }) => applyDeviceTilt(beta, gamma))
 *   wx.stopDeviceMotionListening()
 * 两边都提供 beta（前后，度）/ gamma（左右，度），下面的校准、死区、平滑与映射可原样复用。
 * -------------------------------------------------------------------------- */

const clamp = THREE.MathUtils.clamp;
const degToRad = THREE.MathUtils.degToRad;
const damp = (c, t, l, dt) => c + (t - c) * (1 - Math.exp(-l * dt));

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040c);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 80);
scene.add(camera);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

const hemi = new THREE.HemisphereLight(0xc8d4f0, 0x12101c, 0.42);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe0b0, 2.15);
key.position.set(4.5, 8.5, 3.2);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1;
key.shadow.camera.far = 28;
key.shadow.bias = -0.0008;
key.shadow.normalBias = 0.03;
scene.add(key);
const fill = new THREE.DirectionalLight(0x7a8cb8, 0.32);
fill.position.set(-5, 3, -4);
scene.add(fill);
const rim = new THREE.DirectionalLight(0x6a7fb8, 0.28);
rim.position.set(-3.2, 2.2, -5.5);
scene.add(rim);

// Deep-space backdrop + shared GLSL used by the liquid-glass floor.
// Sit at the far plane so the tilting board never clips against it.
const SPACE_GLSL = `
    float hash13(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }
    float vnoise(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float n000 = hash13(i);
      float n100 = hash13(i + vec3(1.0, 0.0, 0.0));
      float n010 = hash13(i + vec3(0.0, 1.0, 0.0));
      float n110 = hash13(i + vec3(1.0, 1.0, 0.0));
      float n001 = hash13(i + vec3(0.0, 0.0, 1.0));
      float n101 = hash13(i + vec3(1.0, 0.0, 1.0));
      float n011 = hash13(i + vec3(0.0, 1.0, 1.0));
      float n111 = hash13(i + vec3(1.0, 1.0, 1.0));
      float nx00 = mix(n000, n100, f.x);
      float nx10 = mix(n010, n110, f.x);
      float nx01 = mix(n001, n101, f.x);
      float nx11 = mix(n011, n111, f.x);
      return mix(mix(nx00, nx10, f.y), mix(nx01, nx11, f.y), f.z);
    }
    float fbm(vec3 p) {
      float a = 0.0, w = 0.5;
      for (int i = 0; i < 5; i++) {
        a += w * vnoise(p);
        p = p * 2.07 + 1.37;
        w *= 0.5;
      }
      return a;
    }
    mat2 rot(float a) {
      float c = cos(a), s = sin(a);
      return mat2(c, -s, s, c);
    }
    vec3 softStars(vec3 dir, float density, float radius, float bright) {
      vec3 p = dir * density;
      vec3 i0 = floor(p);
      vec3 acc = vec3(0.0);
      for (int z = -1; z <= 1; z++)
      for (int y = -1; y <= 1; y++)
      for (int x = -1; x <= 1; x++) {
        vec3 cell = i0 + vec3(float(x), float(y), float(z));
        float h = hash13(cell);
        if (h > 0.9) {
          vec3 sp = cell + vec3(hash13(cell + 1.1), hash13(cell + 2.3), hash13(cell + 3.7));
          float d = length(p - sp);
          float s = exp(-d * d / max(radius * radius, 1e-5));
          vec3 tint = mix(vec3(0.65, 0.82, 1.0), vec3(1.0, 0.9, 0.72), hash13(cell + 9.0));
          acc += tint * s * bright * (0.45 + h);
        }
      }
      return acc;
    }
    vec3 spaceColor(vec3 d, float time) {
      d = normalize(d);
      float t = time * 0.008;
      vec3 d1 = d;
      d1.xz = rot(t) * d1.xz;
      vec3 d2 = d;
      d2.xy = rot(t * 0.55 + 0.4) * d2.xy;
      float n  = fbm(d1 * 2.15);
      float n2 = fbm(d2 * 3.8 + 8.0);
      float n3 = fbm(d1 * 1.05 + n * 0.85);
      vec3 col = vec3(0.010, 0.012, 0.028);
      col += vec3(0.16, 0.045, 0.20) * smoothstep(0.42, 0.88, n3) * 0.75;
      col += vec3(0.02, 0.10, 0.16) * smoothstep(0.38, 0.82, n2) * 0.55;
      col += vec3(0.12, 0.035, 0.04) * smoothstep(0.55, 0.92, n) * 0.40;
      col *= 0.50 + 0.50 * smoothstep(0.18, 0.72, n2);
      col += softStars(d1, 28.0, 0.42, 0.55);
      col += softStars(d2, 64.0, 0.22, 0.70);
      col += softStars(d1.yzx, 130.0, 0.10, 0.40);
      return col;
    }
`;

const spaceMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  depthTest: false,
  fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      mat4 viewRot = mat4(mat3(modelViewMatrix));
      vec4 clip = projectionMatrix * viewRot * vec4(position, 1.0);
      gl_Position = clip.xyww;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    varying vec3 vDir;
    ${SPACE_GLSL}
    void main() {
      gl_FragColor = vec4(spaceColor(normalize(vDir), uTime), 1.0);
    }
  `
});
const spaceMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), spaceMat);
spaceMesh.name = 'space';
spaceMesh.frustumCulled = false;
spaceMesh.renderOrder = -1000;
scene.add(spaceMesh);

const board = new THREE.Group();
board.name = 'board';
scene.add(board);

// ---------- wood textures ----------
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) {
  let a = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 5; i++) { a += amp * noise2(x * f, y * f); f *= 2; amp *= 0.5; }
  return a;
}
function makeWoodTexture({ w = 512, h = 512, c0 = [0x8b, 0x57, 0x2e], c1 = [0x4a, 0x2a, 0x14], rings = 14, repeatX = 1, repeatY = 1, straight = false } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const n = fbm(nx * (straight ? 2.2 : 6), ny * (straight ? 28 : 18));
      const n2 = fbm(nx * (straight ? 8 : 22), ny * (straight ? 40 : 3.5));
      const wave = Math.sin((nx * rings + n * (straight ? 0.7 : 2.4) + ny * (straight ? 0.08 : 0.4)) * Math.PI * 2) * 0.5 + 0.5;
      const v = clamp(wave * 0.72 + n2 * 0.22 + 0.12, 0, 1);
      const i = (y * w + x) * 4;
      d[i]     = clamp(c0[0] + (c1[0] - c0[0]) * (1 - v) * 0.85 + (n - 0.5) * 18, 0, 255) | 0;
      d[i + 1] = clamp(c0[1] + (c1[1] - c0[1]) * (1 - v) * 0.85 + (n - 0.5) * 12, 0, 255) | 0;
      d[i + 2] = clamp(c0[2] + (c1[2] - c0[2]) * (1 - v) * 0.85 + (n - 0.5) * 8, 0, 255) | 0;
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  tex.repeat.set(repeatX, repeatY);
  tex.needsUpdate = true;
  return tex;
}

const wallMap  = makeWoodTexture({ c0: [0x8d, 0x56, 0x2c], c1: [0x3e, 0x22, 0x10], rings: 16, repeatX: 1, repeatY: 1 });

// Liquid-glass floor: samples the same procedural space as the skybox with
// a slight refraction/magnification, fresnel rim, and a moving specular.
// No transmission pass — same look on desktop and iPhone.
const glassUniforms = {
  uTime: { value: 0 },
  uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.25).normalize() },
  uHalf: { value: new THREE.Vector2(1, 1) },
  uBoardX: { value: new THREE.Vector3(1, 0, 0) },
  uBoardZ: { value: new THREE.Vector3(0, 0, 1) },
  uTint: { value: new THREE.Vector3(0.97, 0.99, 1.03) },
  uWash: { value: new THREE.Vector3(0.78, 0.90, 1.0) },
  uWashAmt: { value: 0.05 },
  uFres: { value: new THREE.Vector3(0.72, 0.88, 1.0) },
  uRim: { value: new THREE.Vector3(0.80, 0.93, 1.0) },
  uRimCore: { value: new THREE.Vector3(1.0, 0.99, 0.98) }
};
const glassMat = new THREE.ShaderMaterial({
  uniforms: glassUniforms,
  transparent: false,
  depthWrite: true,
  side: THREE.DoubleSide,
  fog: false,
  vertexShader: `
    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    varying vec3 vLocalPos;
    varying vec3 vLocalNormal;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;

      vLocalNormal = normal;

    precision highp float;
    uniform float uTime;
    uniform vec3 uLightDir;
    uniform vec2 uHalf;
    uniform vec3 uBoardX;
    uniform vec3 uBoardZ;
    uniform vec3 uTint;
    uniform vec3 uWash;
    uniform float uWashAmt;
    uniform vec3 uFres;
    uniform vec3 uRim;
    uniform vec3 uRimCore;
    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    varying vec3 vLocalPos;
    varying vec3 vLocalNormal;
    ${SPACE_GLSL}

    void main() {
      vec3 I = normalize(vWorldPos - cameraPosition);
      vec3 N = normalize(vWorldNormal);
      if (dot(N, -I) < 0.0) N = -N;

      vec3 bx = normalize(uBoardX);
      vec3 bz = normalize(uBoardZ);
      vec2 lp = vec2(vLocalPos.x / max(uHalf.x, 1e-4), vLocalPos.z / max(uHalf.y, 1e-4));

      // Slight lens magnification + IOR bend so the starfield feels behind glass.
      vec3 rd = normalize(I + (bx * lp.x + bz * lp.y) * 0.07);
      vec3 bent = refract(rd, N, 0.90);
      if (dot(bent, bent) > 0.001) rd = normalize(bent);

      float ax = 1.0 - abs(lp.x);
      float az = 1.0 - abs(lp.y);
      float dEdge = min(ax, az);
      float rim = 1.0 - smoothstep(0.0, 0.030, dEdge);
      float rimSoft = 1.0 - smoothstep(0.0, 0.080, dEdge);
      float rimCore = 1.0 - smoothstep(0.0, 0.012, dEdge);
      float isSide = smoothstep(0.5, 0.8, 1.0 - abs(vLocalNormal.y));
      rim = max(rim, isSide);
      rimSoft = max(rimSoft, isSide * 0.7);

      vec3 T1 = normalize(cross(N, bz));
      if (length(T1) < 0.2) T1 = normalize(cross(N, bx));
      float fringe = max(rim, pow(1.0 - max(dot(N, -I), 0.0), 2.0));

      vec3 col;
      if (fringe > 0.18) {
        float k = 0.016 * fringe;
        vec3 cR = spaceColor(normalize(rd + T1 * k), uTime);
        vec3 cG = spaceColor(rd, uTime);
        vec3 cB = spaceColor(normalize(rd - T1 * k), uTime);
        col = vec3(cR.r, cG.g, cB.b);
      } else {
        col = spaceColor(rd, uTime);
      }

      col *= uTint;
      col = mix(col, uWash, uWashAmt);

      float nv = max(dot(N, -I), 0.0);
      float fres = pow(1.0 - nv, 2.8);
      col += uFres * fres * 0.28;

      col += uRim * (rim * 0.70 + rimSoft * 0.10);
      col += uRimCore * rimCore * 0.65;
      col += uRim * isSide * 0.45;

      // Specular highlight that slides as the board tilts.
      vec3 L = normalize(uLightDir);
      vec3 V = -I;
      vec3 H = normalize(L + V);
      float nh = max(dot(N, H), 0.0);
      col += vec3(1.0, 0.99, 0.97) * pow(nh, 110.0) * 0.95;
      col += vec3(0.78, 0.90, 1.0) * pow(nh, 14.0) * 0.16;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

function canvasTex(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  fn(img.data, w, h);
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  tex.needsUpdate = true;
  return tex;
}
function makeMarbleTexture() {
  return canvasTex(512, 512, (d, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const n = fbm(nx * 3.2 + 2.0 * fbm(nx * 1.4, ny * 1.8), ny * 4.5);
      const v1 = Math.abs(Math.sin((nx * 2.2 + n * 1.8 + ny * 0.35) * Math.PI * 2));
      const v2 = Math.abs(Math.sin((ny * 3.1 - n * 2.2 + nx * 0.7) * Math.PI * 3.2));
      const vein = Math.pow(Math.min(v1, v2 * 0.85 + 0.15), 4.2);
      const cloud = fbm(nx * 5.0, ny * 6.0);
      const body = 208 + (cloud - 0.5) * 22;
      const g = clamp(body - vein * 145, 0, 255);
      const i = (y * w + x) * 4;
      d[i] = clamp(g + 6, 0, 255); d[i + 1] = clamp(g + 1, 0, 255); d[i + 2] = clamp(g - 4, 0, 255); d[i + 3] = 255;
    }
  });
}
function makeBrushedTexture() {
  return canvasTex(512, 256, (d, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const streak = fbm(nx * 28, ny * 1.15);
      const fine = fbm(nx * 70, ny * 3.2);
      const v = clamp(0.28 + streak * 0.48 + (fine - 0.5) * 0.16, 0, 1);
      const i = (y * w + x) * 4;
      d[i]     = (78 + v * 70) | 0;
      d[i + 1] = (86 + v * 74) | 0;
      d[i + 2] = (96 + v * 78) | 0;
      d[i + 3] = 255;
    }
  });
}
function makePearlTexture() {
  return canvasTex(256, 256, (d, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const n = fbm(nx * 3.5, ny * 3.5);
      const n2 = fbm(nx * 9, ny * 8);
      const band = 0.5 + 0.5 * Math.sin((nx * 5.5 + ny * 1.8 + n * 1.6) * Math.PI * 2);
      const v = 0.78 + n * 0.16 + (n2 - 0.5) * 0.08;
      const i = (y * w + x) * 4;
      d[i]     = clamp(230 * v + band * 28, 0, 255) | 0;
      d[i + 1] = clamp(214 * v + 18 + (1.0 - band) * 16, 0, 255) | 0;
      d[i + 2] = clamp(220 * v + 22 + band * 10, 0, 255) | 0;
      d[i + 3] = 255;
    }
  });
}
function makeJadeTexture() {
  return canvasTex(512, 512, (d, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = x / w, ny = y / h;
      const cloud = fbm(nx * 3.2, ny * 3.8);
      const n = fbm(nx * 2.0 + cloud, ny * 5.5);
      const vein = Math.pow(Math.abs(Math.sin((nx * 1.6 + n * 2.4 + ny * 0.9) * Math.PI * 3)), 5.5);
      const ice = Math.pow(Math.max(0, cloud - 0.62), 1.4);
      const r = clamp(18 + cloud * 36 + vein * 70 + ice * 90, 0, 255);
      const g = clamp(78 + cloud * 70 - vein * 20 + ice * 50, 0, 255);
      const b = clamp(48 + cloud * 28 - vein * 8 + ice * 30, 0, 255);
      const i = (y * w + x) * 4;
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
    }
  });
}

  document.body.dataset.theme = id;
  syncSwatches();
  if (persist) {
    try { localStorage.setItem('maze.theme', id); } catch (e) {}
  }
}

  try { id = localStorage.getItem('maze.theme') || 'wood'; } catch (e) {}
  if (!THEMES[id]) id = 'wood';
  currentThemeId = id;
}

// ---------- audio (Web Audio, unlocked on first user gesture) ----------
const MUSIC_OPTS = [
  { id: 'space', label: '太空氛围' },
  { id: 'lofi', label: '轻电子' },
  { id: 'piano', label: '钢琴' },
  { id: 'nature', label: '自然白噪' },
  { id: 'off', label: '关闭' }
];
const audio = {
  ctx: null,
  unlocked: false,
  master: null,
  musicGain: null,
  sfxGain: null,
  musicId: 'space',
  musicVol: 0.45,
  sfxOn: true,
  sfxVol: 0.7,
  musicNodes: [],
  musicTimer: 0,
  musicStop: null,
  noiseBuf: null,
  roll: null,
  lastHit: 0
};

function loadAudioSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('maze.audio') || '{}');
    if (s.musicId && MUSIC_OPTS.some((o) => o.id === s.musicId)) audio.musicId = s.musicId;
    if (typeof s.musicVol === 'number') audio.musicVol = clamp(s.musicVol, 0, 1);
    if (typeof s.sfxOn === 'boolean') audio.sfxOn = s.sfxOn;
    if (typeof s.sfxVol === 'number') audio.sfxVol = clamp(s.sfxVol, 0, 1);
  } catch (e) {}
}
function saveAudioSettings() {
  try {
    localStorage.setItem('maze.audio', JSON.stringify({
      musicId: audio.musicId, musicVol: audio.musicVol, sfxOn: audio.sfxOn, sfxVol: audio.sfxVol
    }));
  } catch (e) {}
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audio.ctx) {
    audio.ctx = new AC();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = 1;
    audio.master.connect(audio.ctx.destination);
    audio.musicGain = audio.ctx.createGain();
    audio.musicGain.gain.value = audio.musicVol;
    audio.musicGain.connect(audio.master);
    audio.sfxGain = audio.ctx.createGain();
    audio.sfxGain.gain.value = audio.sfxOn ? audio.sfxVol : 0;
    audio.sfxGain.connect(audio.master);
    const n = Math.floor(audio.ctx.sampleRate * 1.5);
    const buf = audio.ctx.createBuffer(1, n, audio.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let b = 0;
    for (let i = 0; i < n; i++) { b = 0.97 * b + 0.03 * (Math.random() * 2 - 1); d[i] = b * 3.2; }
    audio.noiseBuf = buf;
  }
  return audio.ctx;
}

function unlockAudio() {
  const ctx = ensureAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  if (!audio.unlocked) {
    audio.unlocked = true;
    startMusic(audio.musicId);
  }
}

function setMusicVol(v) {
  audio.musicVol = clamp(v, 0, 1);
  if (audio.musicGain) audio.musicGain.gain.setTargetAtTime(audio.musicVol, audio.ctx.currentTime, 0.04);
  saveAudioSettings();
}
function setSfxVol(v) {
  audio.sfxVol = clamp(v, 0, 1);
  if (audio.sfxGain) audio.sfxGain.gain.setTargetAtTime(audio.sfxOn ? audio.sfxVol : 0, audio.ctx.currentTime, 0.04);
  saveAudioSettings();
}
function setSfxOn(on) {
  audio.sfxOn = !!on;
  if (audio.sfxGain) audio.sfxGain.gain.setTargetAtTime(audio.sfxOn ? audio.sfxVol : 0, audio.ctx.currentTime, 0.04);
  saveAudioSettings();
  syncAudioUI();
}

function stopMusic() {
  if (audio.musicStop) { try { audio.musicStop(); } catch (e) {} }
  audio.musicStop = null;
  for (const n of audio.musicNodes) {
    try { n.stop?.(); } catch (e) {}
    try { n.disconnect?.(); } catch (e) {}
  }
  audio.musicNodes = [];
}

function addNode(n) { audio.musicNodes.push(n); return n; }

function startMusic(id) {
  audio.musicId = id || 'off';
  saveAudioSettings();
  syncAudioUI();
  if (!audio.unlocked || !audio.ctx) return;
  stopMusic();
  if (audio.musicId === 'off') return;
  const ctx = audio.ctx;
  const out = audio.musicGain;
  const now = ctx.currentTime;
  let stopped = false;
  const stops = [];

  function noiseSrc() {
    const s = ctx.createBufferSource();
    s.buffer = audio.noiseBuf;
    s.loop = true;
    addNode(s);
    return s;
  }

  if (id === 'space') {
    const makePad = (freq, type, gain) => {
      const o = ctx.createOscillator();
      o.type = type; o.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = gain;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07 + Math.random() * 0.05;
      const lg = ctx.createGain(); lg.gain.value = 220;
      lfo.connect(lg); lg.connect(f.frequency);
      o.connect(f); f.connect(g); g.connect(out);
      o.start(); lfo.start();
      addNode(o); addNode(g); addNode(f); addNode(lfo);
    };
    makePad(55, 'sine', 0.10);
    makePad(82.4, 'sine', 0.07);
    makePad(164.8, 'triangle', 0.035);
    const ns = noiseSrc();
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 900; nf.Q.value = 0.7;
    const ng = ctx.createGain(); ng.gain.value = 0.025;
    ns.connect(nf); nf.connect(ng); ng.connect(out); ns.start();
    addNode(nf); addNode(ng);
  } else if (id === 'lofi') {
    const pad = ctx.createOscillator(); pad.type = 'sine'; pad.frequency.value = 110;
    const pg = ctx.createGain(); pg.gain.value = 0.04;
    pad.connect(pg); pg.connect(out); pad.start(); addNode(pad); addNode(pg);
    const beat = 0.5;
    const notes = [0, 3, 7, 10, 7, 3, 0, 5];
    let step = 0;
    const sched = () => {
      if (stopped) return;
      const t0 = ctx.currentTime;
      for (let i = 0; i < 8; i++) {
        const t = t0 + i * beat;
        // kick
        const k = ctx.createOscillator(); k.type = 'sine';
        const kg = ctx.createGain();
        k.frequency.setValueAtTime(140, t);
        k.frequency.exponentialRampToValueAtTime(42, t + 0.1);
        kg.gain.setValueAtTime(0.16, t);
        kg.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        k.connect(kg); kg.connect(out); k.start(t); k.stop(t + 0.2);
        // hat on offbeats
        const hs = ctx.createBufferSource(); hs.buffer = audio.noiseBuf;
        const hf = ctx.createBiquadFilter(); hf.type = 'highpass'; hf.frequency.value = 6000;
        const hg = ctx.createGain();
        const ht = t + beat * 0.5;
        hg.gain.setValueAtTime(0.045, ht);
        hg.gain.exponentialRampToValueAtTime(0.001, ht + 0.06);
        hs.connect(hf); hf.connect(hg); hg.connect(out); hs.start(ht); hs.stop(ht + 0.07);
        // arp
        const n = notes[(step + i) % notes.length];
        const a = ctx.createOscillator(); a.type = 'triangle';
        a.frequency.value = 220 * Math.pow(2, n / 12);
        const ag = ctx.createGain();
        const at = t + 0.02;
        ag.gain.setValueAtTime(0.05, at);
        ag.gain.exponentialRampToValueAtTime(0.001, at + 0.28);
        const lf = ctx.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 1400;
        a.connect(lf); lf.connect(ag); ag.connect(out); a.start(at); a.stop(at + 0.3);
      }
      step += 8;
      audio.musicTimer = setTimeout(sched, beat * 8 * 1000 - 40);
    };
    sched();
    stops.push(() => clearTimeout(audio.musicTimer));
  } else if (id === 'piano') {
    const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19];
    const playNote = (freq, t, dur, amp) => {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g.connect(out);
      [1, 2, 3].forEach((h, i) => {
        const o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.value = freq * h;
        const hg = ctx.createGain(); hg.gain.value = [1, 0.32, 0.12][i];
        o.connect(hg); hg.connect(g); o.start(t); o.stop(t + dur + 0.05);
      });
    };
    const tick = () => {
      if (stopped) return;
      const t = ctx.currentTime + 0.05;
      const n = scale[(Math.random() * scale.length) | 0];
      playNote(261.63 * Math.pow(2, n / 12) * 0.5, t, 1.8 + Math.random(), 0.11);
      if (Math.random() < 0.4) {
        playNote(261.63 * Math.pow(2, (n + 4) / 12) * 0.5, t + 0.03, 1.5, 0.06);
      }
      audio.musicTimer = setTimeout(tick, 900 + Math.random() * 1300);
    };
    tick();
    stops.push(() => clearTimeout(audio.musicTimer));
  } else if (id === 'nature') {
    const wind = noiseSrc();
    const wf = ctx.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 380;
    const wg = ctx.createGain(); wg.gain.value = 0.11;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.12;
    const lg = ctx.createGain(); lg.gain.value = 140;
    lfo.connect(lg); lg.connect(wf.frequency);
    wind.connect(wf); wf.connect(wg); wg.connect(out);
    wind.start(); lfo.start();
    addNode(wf); addNode(wg); addNode(lfo);
    const rainTick = () => {
      if (stopped) return;
      const t = ctx.currentTime;
      const s = ctx.createBufferSource(); s.buffer = audio.noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.03 + Math.random() * 0.03, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      s.connect(f); f.connect(g); g.connect(out);
      s.start(t); s.stop(t + 0.06);
      audio.musicTimer = setTimeout(rainTick, 40 + Math.random() * 90);
    };
    rainTick();
    stops.push(() => clearTimeout(audio.musicTimer));
  }

  audio.musicStop = () => { stopped = true; stops.forEach((fn) => fn()); };
}

function sfxOut() { return audio.unlocked && audio.ctx && audio.sfxOn ? audio.sfxGain : null; }

function playClick() {
  const out = sfxOut(); if (!out) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 1400;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.05);
}

function playHit(impact) {
  const out = sfxOut(); if (!out) return;
  const now = performance.now();
  if (now - audio.lastHit < 70) return;
  audio.lastHit = now;
  const ctx = audio.ctx, t = ctx.currentTime;
  const amp = clamp(impact / 5.5, 0.06, 0.45);
  const theme = currentThemeId;
  if (theme === 'wood') {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 160;
    const g = ctx.createGain(); g.gain.setValueAtTime(amp, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.13);
    const s = ctx.createBufferSource(); s.buffer = audio.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 400; f.Q.value = 0.8;
    const ng = ctx.createGain(); ng.gain.setValueAtTime(amp * 0.7, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    s.connect(f); f.connect(ng); ng.connect(out); s.start(t); s.stop(t + 0.09);
  } else if (theme === 'marble') {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 820;
    const g = ctx.createGain(); g.gain.setValueAtTime(amp * 0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.08);
    const s = ctx.createBufferSource(); s.buffer = audio.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1800;
    const ng = ctx.createGain(); ng.gain.setValueAtTime(amp * 0.5, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    s.connect(f); f.connect(ng); ng.connect(out); s.start(t); s.stop(t + 0.05);
  } else if (theme === 'titanium') {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(1480, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.18);
    const g = ctx.createGain(); g.gain.setValueAtTime(amp * 0.65, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.23);
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 2960;
    const g2 = ctx.createGain(); g2.gain.setValueAtTime(amp * 0.2, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t + 0.11);
  } else if (theme === 'glass') {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 2400;
    const g = ctx.createGain(); g.gain.setValueAtTime(amp * 0.55, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.17);
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 3600;
    const g2 = ctx.createGain(); g2.gain.setValueAtTime(amp * 0.28, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t + 0.1);
  } else if (theme === 'pearl') {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 1100;
    const g = ctx.createGain(); g.gain.setValueAtTime(amp * 0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.07);
  } else {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(660, t + 0.35);
    const g = ctx.createGain(); g.gain.setValueAtTime(amp * 0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.42);
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 1320;
    const g2 = ctx.createGain(); g2.gain.setValueAtTime(amp * 0.22, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o2.connect(g2); g2.connect(out); o2.start(t); o2.stop(t + 0.32);
  }
}

function playFallWhoosh() {
  const out = sfxOut(); if (!out) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  const o = ctx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(60, t + 1.1);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(200, t + 1.1);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
  o.connect(f); f.connect(g); g.connect(out); o.start(t); o.stop(t + 1.25);
  const s = ctx.createBufferSource(); s.buffer = audio.noiseBuf;
  const ng = ctx.createGain(); ng.gain.setValueAtTime(0.12, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 1.15);
  const nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 900;
  s.connect(nf); nf.connect(ng); ng.connect(out); s.start(t); s.stop(t + 1.2);
}

function playWin() {
  const out = sfxOut(); if (!out) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ctx.createGain();
    const tt = t + i * 0.12;
    g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(0.12, tt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, tt + 0.55);
    o.connect(g); g.connect(out); o.start(tt); o.stop(tt + 0.56);
  });
}

function playGameOver() {
  const out = sfxOut(); if (!out) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  [392, 311, 247].forEach((f, i) => {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ctx.createGain();
    const tt = t + i * 0.22;
    g.gain.setValueAtTime(0.12, tt); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.45);
    o.connect(g); g.connect(out); o.start(tt); o.stop(tt + 0.46);
  });
}

function updateRollSound(speed) {
  if (!audio.unlocked || !audio.ctx || !audio.sfxOn) {
    if (audio.roll) audio.roll.gain.gain.setTargetAtTime(0, audio.ctx ? audio.ctx.currentTime : 0, 0.08);
    return;
  }
  const ctx = audio.ctx;
  if (!audio.roll) {
    const src = ctx.createBufferSource(); src.buffer = audio.noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 1.2;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(audio.sfxGain);
    src.start();
    audio.roll = { src, filter: f, gain: g };
  }
  const amt = clamp((speed - 0.15) / 5.2, 0, 1);
  audio.roll.gain.gain.setTargetAtTime(amt * 0.16, ctx.currentTime, 0.06);
  audio.roll.filter.frequency.setTargetAtTime(380 + amt * 720, ctx.currentTime, 0.06);
}

// ---------- theme / audio UI ----------
function swatchHTML(id, withLabel) {
  const t = THEMES[id];
  const on = id === currentThemeId ? ' on' : '';
  return `<button type="button" class="swatch${on}" data-theme="${id}" aria-label="${t.label}">
    <span class="dot" style="background:linear-gradient(135deg,${t.swatch[0]},${t.swatch[1]})"></span>
    ${withLabel ? `<span class="sw-lab">${t.label}</span>` : ''}
  </button>`;
}
function syncSwatches() {
  document.querySelectorAll('.swatch').forEach((el) => {
    el.classList.toggle('on', el.dataset.theme === currentThemeId);
  });
}
function bindSwatches(root) {
  root.querySelectorAll('.swatch').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      unlockAudio(); playClick();
      applyTheme(el.dataset.theme);
    });
  });
}
function fillSwatchRow(el, withLabel) {
  el.innerHTML = THEME_ORDER.map((id) => swatchHTML(id, withLabel)).join('');
  bindSwatches(el);
}

function syncAudioUI() {
  document.querySelectorAll('.mchip').forEach((el) => {
    el.classList.toggle('on', el.dataset.music === audio.musicId);
  });
  const mv = document.getElementById('musicVol');
  const sv = document.getElementById('sfxVol');
  const so = document.getElementById('sfxOn');
  if (mv && mv.value !== String(audio.musicVol)) mv.value = audio.musicVol;
  if (sv && sv.value !== String(audio.sfxVol)) sv.value = audio.sfxVol;
  if (so) so.checked = audio.sfxOn;
  const lab = document.getElementById('sfxOnLab');
  if (lab) lab.textContent = audio.sfxOn ? '开' : '关';
}

function openSheet() {
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheetBak').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetBak').classList.remove('open');
}

function initThemeAudioUI() {
  loadTheme();
  loadAudioSettings();
  fillSwatchRow(document.getElementById('startSwatches'), true);
  fillSwatchRow(document.getElementById('sheetSwatches'), true);
  const chips = document.getElementById('musicChips');
  chips.innerHTML = MUSIC_OPTS.map((o) => `<button type="button" class="mchip" data-music="${o.id}">${o.label}</button>`).join('');
  chips.addEventListener('click', (e) => {
    const b = e.target.closest('.mchip'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    unlockAudio(); playClick();
    startMusic(b.dataset.music);
  });
  document.getElementById('musicVol').addEventListener('input', (e) => { unlockAudio(); setMusicVol(+e.target.value); });
  document.getElementById('sfxVol').addEventListener('input', (e) => { unlockAudio(); setSfxVol(+e.target.value); });
  document.getElementById('sfxOn').addEventListener('change', (e) => { unlockAudio(); playClick(); setSfxOn(e.target.checked); });
  document.getElementById('themeBtn').addEventListener('click', (e) => { e.stopPropagation(); unlockAudio(); playClick(); openSheet(); });
  document.getElementById('sheetBak').addEventListener('click', closeSheet);
  document.getElementById('sheetClose').addEventListener('click', (e) => { e.stopPropagation(); playClick(); closeSheet(); });
  syncAudioUI();
  applyTheme(currentThemeId, false);
}


// ---------- maze generation (recursive backtracker) ----------
function generateMaze(cols, rows) {
  const cells = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => ({ n: true, s: true, e: true, w: true }))
  );
  const vis = Array.from({ length: rows }, () => Array(cols).fill(false));
  const stack = [[0, 0]];
  vis[0][0] = true;
  const dirs = [
    [0, -1, 'n', 's'],
    [0,  1, 's', 'n'],
    [1,  0, 'e', 'w'],
    [-1, 0, 'w', 'e']
  ];
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const opts = [];
    for (const [dx, dy, a, b] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < cols && ny < rows && !vis[ny][nx]) opts.push([nx, ny, a, b]);
    }
    if (!opts.length) { stack.pop(); continue; }
    const [nx, ny, a, b] = opts[(Math.random() * opts.length) | 0];
    cells[y][x][a] = false;
    cells[ny][nx][b] = false;
    vis[ny][nx] = true;
    stack.push([nx, ny]);
  }
  return cells;
}

// ---------- constants & state ----------
const CELL = 0.72;
const WALL_T = 0.11;
const WALL_H = 0.34;
const FLOOR_T = 0.07;
const RADIUS = 0.13;
const MAX_LIVES = 3;
const G = 19;
const FRICTION = 1.15;
const RESTITUTION = 0.32;
const MAX_SPEED = 6.2;
const SUB_DT = 1 / 120;
const MAX_TILT = degToRad(15);
const DEAD_ZONE = 1.4; // degrees
const TILT_SENS = 0.85;

let level = 1;
let cols = 7, rows = 7;
let wallBoxes = []; // {minX,maxX,minZ,maxZ}
let gaps = []; // {side:'n'|'s'|'e'|'w', min, max}
let startPos = new THREE.Vector3();
let exitPos = new THREE.Vector3();
let mazeRoot = null;
let ball = null;
let contactShadow = null;
let lives = MAX_LIVES;
let falling = false;
let gameOver = false;
const fall = {
  active: false,
  t: 0,
  dur: 1.55,
  startPos: new THREE.Vector3(),
  startVel: new THREE.Vector3(),
  startQuat: new THREE.Quaternion()
};

const pos = new THREE.Vector3();
const vel = new THREE.Vector3();
const tilt = { x: 0, z: 0, tx: 0, tz: 0, hold: false };
const keys = { n: false, s: false, e: false, w: false };
const drag = { active: false, sx: 0, sy: 0, x: 0, z: 0 };

const device = {
  enabled: false,
  listening: false,
  hasEvent: false,
  rawBeta: 0,
  rawGamma: 0,
  calBeta: 0,
  calGamma: 0,
  needCal: true,
  smBeta: 0,
  smGamma: 0
};

let playing = false;
let won = false;
let startTime = 0;
let elapsed = 0;
let hintTimer = 0;
let frameCount = 0;
let physSteps = 0;

const tmpAxis = new THREE.Vector3();
const tmpQ = new THREE.Quaternion();
const tmpV = new THREE.Vector3();

function sizeForLevel(lv) {
  return Math.min(7 + (lv - 1) * 2, 15);
}
function gapCountFor(lv) {
  const max = Math.max(4, sizeForLevel(lv) * 2 - 4); // eligible edges are plentiful
  return Math.min(1 + (lv - 1), max);
}
function gapWidthFor(lv) {
  return CELL * Math.min(0.5 + (lv - 1) * 0.12, 1.4);
}
function boardExtent() {
  return { hw: cols * CELL * 0.5, hd: rows * CELL * 0.5 };
}

function cellCenter(i, j) {
  const ox = (cols - 1) * CELL * 0.5;
  const oz = (rows - 1) * CELL * 0.5;
  return new THREE.Vector3(i * CELL - ox, RADIUS, j * CELL - oz);
}

function addBox(minX, maxX, minZ, maxZ) {
  wallBoxes.push({ minX, maxX, minZ, maxZ });
}

// ---------- build / rebuild maze ----------
function clearMaze() {
  if (mazeRoot) {
    board.remove(mazeRoot);
    mazeRoot.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
    });
  }
  wallBoxes = [];
  gaps = [];
  mazeRoot = new THREE.Group();
  board.add(mazeRoot);
}

function buildLevel(lv) {
  clearMaze();
  level = lv;
  cols = rows = sizeForLevel(lv);
  const cells = generateMaze(cols, rows);
  const ox = (cols - 1) * CELL * 0.5;
  const oz = (rows - 1) * CELL * 0.5;
  const hw = cols * CELL * 0.5;
  const hd = rows * CELL * 0.5;
  const boardW = cols * CELL + WALL_T;
  const boardD = rows * CELL + WALL_T;

  // frosted-glass floor (extends to the outer face of the boundary walls)
  const floor = new THREE.Mesh(new THREE.BoxGeometry(boardW, FLOOR_T, boardD), glassMat);
  floor.name = 'glassFloor';
  floor.position.y = -FLOOR_T * 0.5;
  floor.renderOrder = 0;
  mazeRoot.add(floor);
  glassUniforms.uHalf.value.set(boardW * 0.5, boardD * 0.5);

  planGaps(ox, oz, hw, hd);

  // walls as instanced boxes (outer boundary uses the same style, with gaps punched out)
  const wallSpecs = [];
  const seen = new Set();
  function wallKey(x, z, sx, sz) {
    return [x.toFixed(3), z.toFixed(3), sx.toFixed(3), sz.toFixed(3)].join('|');
  }
  function addWall(x, z, sx, sz) {
    const k = wallKey(x, z, sx, sz);
    if (seen.has(k)) return;
    seen.add(k);
    wallSpecs.push({ x, z, sx, sz });
    addBox(x - sx * 0.5, x + sx * 0.5, z - sz * 0.5, z + sz * 0.5);
  }
  function subtractIntervals(intervals, gmin, gmax) {
    const out = [];
    for (const it of intervals) {
      if (gmax <= it.a || gmin >= it.b) { out.push(it); continue; }
      if (gmin > it.a) out.push({ a: it.a, b: Math.min(gmin, it.b) });
      if (gmax < it.b) out.push({ a: Math.max(gmax, it.a), b: it.b });
    }
    return out;
  }
  function addMaybeGappedWall(x, z, sx, sz, side) {
    if (!side) { addWall(x, z, sx, sz); return; }
    const alongX = (side === 'n' || side === 's');
    let intervals = alongX
      ? [{ a: x - sx * 0.5, b: x + sx * 0.5 }]
      : [{ a: z - sz * 0.5, b: z + sz * 0.5 }];
    for (const g of gaps) {
      if (g.side === side) intervals = subtractIntervals(intervals, g.min, g.max);
    }
    for (const it of intervals) {
      const len = it.b - it.a;
      if (len < 0.025) continue;
      const mid = (it.a + it.b) * 0.5;
      if (alongX) addWall(mid, z, len, WALL_T);
      else addWall(x, mid, WALL_T, len);
    }
  }

  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const cx = i * CELL - ox;
      const cz = j * CELL - oz;
      const c = cells[j][i];
      const len = CELL + WALL_T * 0.02;
      if (c.n) addMaybeGappedWall(cx, cz - CELL * 0.5, len, WALL_T, j === 0 ? 'n' : null);
      if (c.s) addMaybeGappedWall(cx, cz + CELL * 0.5, len, WALL_T, j === rows - 1 ? 's' : null);
      if (c.w) addMaybeGappedWall(cx - CELL * 0.5, cz, WALL_T, len, i === 0 ? 'w' : null);
      if (c.e) addMaybeGappedWall(cx + CELL * 0.5, cz, WALL_T, len, i === cols - 1 ? 'e' : null);
    }
  }

  const wallGeom = new THREE.BoxGeometry(1, WALL_H, 1);
  wallInst = new THREE.InstancedMesh(wallGeom, getTheme().wallMat, wallSpecs.length);
  wallInst.castShadow = true;
  wallInst.receiveShadow = true;
  const dummy = new THREE.Object3D();
  wallSpecs.forEach((s, i) => {
    dummy.position.set(s.x, WALL_H * 0.5, s.z);
    dummy.scale.set(s.sx, 1, s.sz);
    dummy.updateMatrix();
    wallInst.setMatrixAt(i, dummy.matrix);
  });
  wallInst.instanceMatrix.needsUpdate = true;
  mazeRoot.add(wallInst);

  startPos.copy(cellCenter(0, 0));
  exitPos.copy(cellCenter(cols - 1, rows - 1));

  const startPad = new THREE.Mesh(new THREE.CylinderGeometry(CELL * 0.28, CELL * 0.28, 0.016, 24), startMat);
  startPad.position.set(startPos.x, 0.009, startPos.z);
  startPad.receiveShadow = true;
  mazeRoot.add(startPad);

  const exitPad = new THREE.Mesh(new THREE.CylinderGeometry(CELL * 0.30, CELL * 0.30, 0.02, 24), exitMat);
  exitPad.position.set(exitPos.x, 0.01, exitPos.z);
  exitPad.receiveShadow = true;
  mazeRoot.add(exitPad);
  themeExitRing = new THREE.Mesh(
    new THREE.TorusGeometry(CELL * 0.30, 0.012, 8, 24),
    exitRingMat
  );
  themeExitRing.rotation.x = Math.PI / 2;
  themeExitRing.position.set(exitPos.x, 0.02, exitPos.z);
  mazeRoot.add(themeExitRing);
  themeExitLight = new THREE.PointLight(0xffc060, 0.7, 1.6);
  themeExitLight.position.set(exitPos.x, 0.35, exitPos.z);
  mazeRoot.add(themeExitLight);

  if (!ball) {
    ball = new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 32, 24), ballMat);
    ball.castShadow = true;
    ball.name = 'ball';
    board.add(ball);
  }
  if (!contactShadow) {
    const cMat = new THREE.MeshBasicMaterial({
      color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false
    });
    contactShadow = new THREE.Mesh(new THREE.CircleGeometry(RADIUS * 1.7, 24), cMat);
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.y = 0.003;
    contactShadow.renderOrder = 2;
    contactShadow.name = 'contactShadow';
    board.add(contactShadow);
  }
  resetBall();
  fitCamera();
  updateShadowCamera(boardW);
  updateLevelLabel();
  updateLivesHUD();
  applyTheme(currentThemeId, false);
}

function planGaps(ox, oz, hw, hd) {
  gaps = [];
  const width = gapWidthFor(level);
  const want = gapCountFor(level);
  const eligible = [];
  for (let i = 0; i < cols; i++) {
    if (i !== 0) eligible.push({ side: 'n', center: i * CELL - ox });
    if (i !== cols - 1) eligible.push({ side: 's', center: i * CELL - ox });
  }
  for (let j = 0; j < rows; j++) {
    if (j !== 0) eligible.push({ side: 'w', center: j * CELL - oz });
    if (j !== rows - 1) eligible.push({ side: 'e', center: j * CELL - oz });
  }
  // shuffle
  for (let i = eligible.length - 1; i > 0; i--) {
    const k = (Math.random() * (i + 1)) | 0;
    const tmp = eligible[i]; eligible[i] = eligible[k]; eligible[k] = tmp;
  }
  function protectedRange(side) {
    if (side === 'n') return [-hw, -hw + CELL];
    if (side === 'w') return [-hd, -hd + CELL];
    if (side === 's') return [hw - CELL, hw];
    if (side === 'e') return [hd - CELL, hd];
    return [0, 0];
  }
  function overlaps(side, a, b) {
    for (const g of gaps) {
      if (g.side !== side) continue;
      if (!(b <= g.min || a >= g.max)) return true;
    }
    const [p0, p1] = protectedRange(side);
    if (!(b <= p0 || a >= p1)) return true;
    return false;
  }
  for (const e of eligible) {
    if (gaps.length >= want) break;
    let a = e.center - width * 0.5;
    let b = e.center + width * 0.5;
    const limit = (e.side === 'n' || e.side === 's') ? hw : hd;
    a = Math.max(a, -limit + 0.02);
    b = Math.min(b,  limit - 0.02);
    if (b - a < width * 0.45) continue;
    if (overlaps(e.side, a, b)) continue;
    gaps.push({ side: e.side, min: a, max: b });
  }
}

function updateLevelLabel() {
  const el = document.getElementById('levelLabel');
  el.textContent = '第 ' + level + ' 关 · 难度 ' + level + ' · 开口 ' + gaps.length;
}

function updateLivesHUD() {
  const el = document.getElementById('livesLabel');
  if (!el) return;
  let hearts = '';
  for (let i = 0; i < MAX_LIVES; i++) {
    hearts += i < lives ? '❤' : '<span class="off">❤</span>';
  }
  el.innerHTML = '生命 <span class="hearts">' + hearts + '</span>';
}

function updateShadowCamera(boardW) {
  const s = boardW * 0.7 + 1.2;
  const cam = key.shadow.camera;
  cam.left = -s; cam.right = s; cam.top = s; cam.bottom = -s;
  cam.updateProjectionMatrix();
  key.position.set(s * 0.55, s * 1.15, s * 0.4);
}

function fitCamera() {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  const boardW = cols * CELL + WALL_T;
  camera.fov = aspect < 0.72 ? 50 : 42;
  const half = boardW * 0.55;
  const vFit = half / Math.tan(degToRad(camera.fov * 0.5));
  const hFit = half / Math.tan(degToRad(camera.fov * 0.5)) / aspect;
  const dist = Math.max(vFit, hFit) * 1.05;
  camera.position.set(0, dist * 0.94, dist * 0.28);
  camera.lookAt(0, 0, 0.02);
  camera.near = 0.05;
  camera.far = dist * 5;
  camera.updateProjectionMatrix();
}

function resetBall() {
  if (ball && ball.parent !== board) board.add(ball);
  ball.scale.setScalar(1);
  ball.visible = true;
  pos.copy(startPos);
  pos.y = RADIUS;
  vel.set(0, 0, 0);
  ball.position.copy(pos);
  ball.quaternion.identity();
  tilt.x = tilt.z = tilt.tx = tilt.tz = 0;
  tilt.hold = false;
  board.rotation.set(0, 0, 0);
  won = false;
  falling = false;
  fall.active = false;
  fall.t = 0;
  if (contactShadow) {
    contactShadow.visible = true;
    contactShadow.position.set(pos.x, 0.003, pos.z);
  }
}

// ---------- physics ----------
function collideWalls() {
  const r = RADIUS * 0.98;
  let bestImpact = 0;
  for (let n = 0; n < 3; n++) {
    let hit = false;
    for (const b of wallBoxes) {
      const cx = clamp(pos.x, b.minX, b.maxX);
      const cz = clamp(pos.z, b.minZ, b.maxZ);
      let dx = pos.x - cx, dz = pos.z - cz;
      const d2 = dx * dx + dz * dz;
      if (d2 >= r * r) {
        // fully inside a thick wall (rare, after a teleport) — handled below if d2==0 and inside
        if (pos.x > b.minX && pos.x < b.maxX && pos.z > b.minZ && pos.z < b.maxZ) {
          const left = pos.x - b.minX, right = b.maxX - pos.x;
          const top = pos.z - b.minZ, bot = b.maxZ - pos.z;
          const m = Math.min(left, right, top, bot);
          if (m === left) { pos.x = b.minX - r; if (vel.x > 0) { bestImpact = Math.max(bestImpact, vel.x); vel.x = -vel.x * RESTITUTION; } }
          else if (m === right) { pos.x = b.maxX + r; if (vel.x < 0) { bestImpact = Math.max(bestImpact, -vel.x); vel.x = -vel.x * RESTITUTION; } }
          else if (m === top) { pos.z = b.minZ - r; if (vel.z > 0) { bestImpact = Math.max(bestImpact, vel.z); vel.z = -vel.z * RESTITUTION; } }
          else { pos.z = b.maxZ + r; if (vel.z < 0) { bestImpact = Math.max(bestImpact, -vel.z); vel.z = -vel.z * RESTITUTION; } }
          hit = true;
        }
        continue;
      }
      if (d2 < 1e-12) {
        const left = pos.x - b.minX, right = b.maxX - pos.x;
        const top = pos.z - b.minZ, bot = b.maxZ - pos.z;
        const m = Math.min(left, right, top, bot);
        if (m === left) { pos.x = b.minX - r; if (vel.x > 0) { bestImpact = Math.max(bestImpact, vel.x); vel.x = -vel.x * RESTITUTION; } }
        else if (m === right) { pos.x = b.maxX + r; if (vel.x < 0) { bestImpact = Math.max(bestImpact, -vel.x); vel.x = -vel.x * RESTITUTION; } }
        else if (m === top) { pos.z = b.minZ - r; if (vel.z > 0) { bestImpact = Math.max(bestImpact, vel.z); vel.z = -vel.z * RESTITUTION; } }
        else { pos.z = b.maxZ + r; if (vel.z < 0) { bestImpact = Math.max(bestImpact, -vel.z); vel.z = -vel.z * RESTITUTION; } }
        hit = true;
        continue;
      }
      const d = Math.sqrt(d2);
      const nx = dx / d, nz = dz / d;
      const pen = r - d;
      pos.x += nx * pen;
      pos.z += nz * pen;
      const vn = vel.x * nx + vel.z * nz;
      if (vn < 0) {
        bestImpact = Math.max(bestImpact, -vn);
        vel.x -= (1 + RESTITUTION) * vn * nx;
        vel.z -= (1 + RESTITUTION) * vn * nz;
      }
      hit = true;
    }
    if (!hit) break;
  }
  if (bestImpact > 0.45) playHit(bestImpact);
}

function physicsStep(dt) {
  if (fall.active || falling) return;
  // gravity in board space from current visual tilt
  vel.x += G * Math.sin(tilt.z) * dt;
  vel.z += -G * Math.sin(tilt.x) * dt;

  const sp = Math.hypot(vel.x, vel.z);
  if (sp > 1e-6) {
    const ns = Math.max(0, sp - FRICTION * dt);
    vel.x *= ns / sp;
    vel.z *= ns / sp;
  }
  const sp2 = Math.hypot(vel.x, vel.z);
  if (sp2 > MAX_SPEED) {
    vel.x *= MAX_SPEED / sp2;
    vel.z *= MAX_SPEED / sp2;
  }

  pos.x += vel.x * dt;
  pos.z += vel.z * dt;
  collideWalls();
  checkFall();

  const sp3 = Math.hypot(vel.x, vel.z);
  if (sp3 > 1e-5) {
    tmpAxis.set(vel.z, 0, -vel.x).normalize();
    tmpQ.setFromAxisAngle(tmpAxis, (sp3 / RADIUS) * dt);
    ball.quaternion.premultiply(tmpQ);
  }
}

function inGap(side, along) {
  for (const g of gaps) {
    if (g.side === side && along >= g.min && along <= g.max) return true;
  }
  return false;
}

function checkFall() {
  if (falling || fall.active || won || !playing) return;
  const { hw, hd } = boardExtent();
  if (pos.z < -hd) { if (inGap('n', pos.x)) beginFall(); }
  else if (pos.z > hd) { if (inGap('s', pos.x)) beginFall(); }
  else if (pos.x < -hw) { if (inGap('w', pos.z)) beginFall(); }
  else if (pos.x > hw) { if (inGap('e', pos.z)) beginFall(); }
}

function beginFall() {
  falling = true;
  playing = false;
  fall.active = true;
  fall.t = 0;
  board.updateMatrixWorld(true);
  ball.getWorldPosition(fall.startPos);
  tmpV.set(vel.x, 0, vel.z).applyQuaternion(board.quaternion);
  fall.startVel.copy(tmpV);
  ball.getWorldQuaternion(fall.startQuat);
  scene.add(ball);
  ball.position.copy(fall.startPos);
  ball.quaternion.copy(fall.startQuat);
  if (contactShadow) contactShadow.visible = false;
  playFallWhoosh();
}

function updateFall(dt) {
  if (!fall.active) return;
  fall.t += dt;
  const u = Math.min(1, fall.t / fall.dur);
  const ease = u * u;
  const p = tmpV.copy(fall.startPos);
  p.x += fall.startVel.x * fall.t;
  p.z += fall.startVel.z * fall.t;
  p.y += fall.startVel.y * fall.t - 0.5 * 8.8 * fall.t * fall.t - ease * 1.4;
  ball.position.copy(p);
  const s = Math.max(0.05, 1 - ease * 0.93);
  ball.scale.setScalar(s);
  ball.rotateOnWorldAxis(tmpAxis.set(0.35, 0.2, 0.9).normalize(), dt * 3.2);
  if (u >= 1) finishFall();
}

function finishFall() {
  fall.active = false;
  falling = false;
  lives = Math.max(0, lives - 1);
  updateLivesHUD();
  ball.scale.setScalar(1);
  board.add(ball);
  if (lives <= 0) {
    showGameOver();
  } else {
    resetBall();
    playing = true;
    startTime = performance.now();
    elapsed = 0;
    timeLabel.textContent = '0.0 秒';
    hintEl.textContent = '剩余生命 ' + lives + ' · 从起点再出发';
    hintEl.style.opacity = '1';
    hintTimer = 2.2;
  }
}

function checkWin() {
  const dx = pos.x - exitPos.x, dz = pos.z - exitPos.z;
  if (dx * dx + dz * dz < (CELL * 0.26) * (CELL * 0.26)) {
    won = true;
    playing = false;
    elapsed = (performance.now() - startTime) / 1000;
    showWin();
  }
}

// ---------- controls ----------
function applyDeviceTilt(beta, gamma) {
  device.hasEvent = true;
  device.rawBeta = beta || 0;
  device.rawGamma = gamma || 0;
  if (device.needCal) {
    device.calBeta = device.rawBeta;
    device.calGamma = device.rawGamma;
    device.smBeta = device.rawBeta;
    device.smGamma = device.rawGamma;
    device.needCal = false;
  }
}

function calibrate() {
  device.calBeta = device.rawBeta;
  device.calGamma = device.rawGamma;
  device.needCal = false;
}

function onOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  if (!device.enabled) {
    device.enabled = true;
    if (playing) {
      calBtn.style.display = 'block';
      hintEl.textContent = '倾斜手机控制木盒 · 可点「校准水平」';
      hintEl.style.opacity = '1';
      hintTimer = 3.2;
    }
  }
  applyDeviceTilt(e.beta, e.gamma);
}

function updateTiltTargets(dt) {
  // device
  let dx = 0, dz = 0, fromDevice = false;
  if (device.enabled && device.hasEvent) {
    device.smBeta = damp(device.smBeta, device.rawBeta, 10, dt);
    device.smGamma = damp(device.smGamma, device.rawGamma, 10, dt);
    let db = device.smBeta - device.calBeta;
    let dg = device.smGamma - device.calGamma;
    const mag = Math.hypot(db, dg);
    if (mag < DEAD_ZONE) { db = 0; dg = 0; }
    else {
      const s = (mag - DEAD_ZONE) / mag;
      db *= s; dg *= s;
    }
    // 手机平放、屏幕朝上：右边缘下压（gamma>0）球向右；顶端下压（beta<0）球向上远离自己
    dz = clamp(degToRad(dg) * TILT_SENS, -MAX_TILT, MAX_TILT);
    dx = clamp(degToRad(-db) * TILT_SENS, -MAX_TILT, MAX_TILT);
    fromDevice = true;
  }

  // keyboard / WASD
  let kx = 0, kz = 0;
  if (keys.n) kx += 1;
  if (keys.s) kx -= 1;
  if (keys.e) kz += 1;
  if (keys.w) kz -= 1;
  if (kx || kz) {
    const len = Math.hypot(kx, kz) || 1;
    kx /= len; kz /= len;
    dx = kx * MAX_TILT;
    dz = kz * MAX_TILT;
    fromDevice = false;
  } else if (drag.active) {
    dx = drag.x;
    dz = drag.z;
    fromDevice = false;
  } else if (tilt.hold) {
    dx = tilt.tx;
    dz = tilt.tz;
    fromDevice = false;
  } else if (!fromDevice) {
    dx = 0; dz = 0;
  }

  tilt.tx = dx;
  tilt.tz = dz;
}

function isTouchPhone() {
  return /iPhone|iPad|iPod|Android|Mobile|MicroMessenger/i.test(navigator.userAgent || '');
}

async function enableGyro() {
  let listen = false;
  try {
    const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    if (isiOS && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const perm = await DeviceOrientationEvent.requestPermission();
      listen = perm === 'granted';
    } else if (isTouchPhone() && typeof DeviceOrientationEvent !== 'undefined') {
      listen = true;
    }
  } catch (err) {
    listen = false;
  }
  if (listen) {
    device.listening = true;
    device.needCal = true;
    window.removeEventListener('deviceorientation', onOrientation, true);
    window.addEventListener('deviceorientation', onOrientation, true);
  }
  return listen;
}

// keyboard
const keyMap = {
  ArrowUp: 'n', KeyW: 'n',
  ArrowDown: 's', KeyS: 's',
  ArrowLeft: 'w', KeyA: 'w',
  ArrowRight: 'e', KeyD: 'e'
};
addEventListener('keydown', (e) => {
  const k = keyMap[e.code];
  if (!k) return;
  keys[k] = true;
  e.preventDefault();
});
addEventListener('keyup', (e) => {
  const k = keyMap[e.code];
  if (!k) return;
  keys[k] = false;
  e.preventDefault();
});

// mouse / touch drag (desktop & fallback)
function pointerPos(e) {
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function onPointerDown(e) {
  if (!playing || e.target.closest('button') || e.target.closest('#overlay')) return;
  const p = pointerPos(e);
  drag.active = true;
  drag.sx = p.x; drag.sy = p.y;
  drag.x = 0; drag.z = 0;
}
function onPointerMove(e) {
  if (!drag.active) return;
  const p = pointerPos(e);
  const nx = (p.x - drag.sx) / Math.max(160, innerWidth * 0.28);
  const ny = (p.y - drag.sy) / Math.max(160, innerHeight * 0.28);
  drag.z = clamp(nx * MAX_TILT, -MAX_TILT, MAX_TILT);
  drag.x = clamp(-ny * MAX_TILT, -MAX_TILT, MAX_TILT);
}
function onPointerUp() {
  drag.active = false;
  drag.x = 0; drag.z = 0;
}
const canvas = renderer.domElement;
canvas.addEventListener('mousedown', onPointerDown);
addEventListener('mousemove', onPointerMove);
addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
addEventListener('touchmove', (e) => { if (playing) e.preventDefault(); onPointerMove(e); }, { passive: false });
addEventListener('touchend', onPointerUp);
addEventListener('touchcancel', onPointerUp);
addEventListener('touchmove', (e) => { if (e.target === canvas || playing) e.preventDefault(); }, { passive: false });
addEventListener('gesturestart', (e) => e.preventDefault());

addEventListener('resize', () => {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
});
try { screen.orientation?.lock?.('portrait').catch(() => {}); } catch (e) {}

// ---------- UI / game flow ----------
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const cardSub = document.getElementById('cardSub');
const cardStat = document.getElementById('cardStat');
const timeLabel = document.getElementById('timeLabel');
const hintEl = document.getElementById('hint');
const calBtn = document.getElementById('calibrate');

function hideOverlay() { overlay.classList.add('hidden'); }
function showOverlay() { overlay.classList.remove('hidden'); }

function startPlay() {
  resetBall();
  playing = true;
  won = false;
  gameOver = false;
  startTime = performance.now();
  elapsed = 0;
  timeLabel.textContent = '0.0 秒';
  hideOverlay();
  document.getElementById('themeBtn').style.display = 'block';
  updateLivesHUD();
  const gyro = device.listening || device.enabled;
  calBtn.style.display = gyro ? 'block' : 'none';
  hintEl.style.opacity = '1';
  hintEl.textContent = gyro
    ? '倾斜手机，避开开口 · 点「校准水平」'
    : '方向键 / WASD 或拖动屏幕 · 避开外墙开口';
  hintTimer = 3.2;
}

function showWin() {
  document.getElementById('startExtras').hidden = true;
  document.getElementById('cardTitle').textContent = '走出迷宫';
  cardSub.textContent = '小球到达出口';
  cardStat.hidden = false;
  cardStat.textContent = '用时 ' + elapsed.toFixed(1) + ' 秒';
  startBtn.textContent = '再玩一次';
  nextBtn.hidden = false;
  nextBtn.textContent = level >= 5 ? '再来一关' : '下一关（更大迷宫）';
  calBtn.style.display = 'none';
  showOverlay();
  playWin();
}

function showGameOver() {
  gameOver = true;
  playing = false;
  document.getElementById('startExtras').hidden = true;
  document.getElementById('cardTitle').textContent = '游戏结束';
  cardSub.textContent = '生命用尽，掉入了无尽星空';
  cardStat.hidden = false;
  cardStat.textContent = '到达第 ' + level + ' 关';
  startBtn.textContent = '重新开始';
  nextBtn.hidden = true;
  calBtn.style.display = 'none';
  showOverlay();
  playGameOver();
}

startBtn.addEventListener('click', async () => {
  unlockAudio();
  const gyro = await enableGyro();
  if (gameOver) {
    lives = MAX_LIVES;
    gameOver = false;
    buildLevel(level);
    startPlay();
  } else if (!playing || won) {
    if (!won) lives = MAX_LIVES;
    startPlay();
  }
  if (!gyro && !device.enabled && isTouchPhone()) {
    hintEl.textContent = '未获得陀螺仪权限，可拖动屏幕来倾斜木盒';
    hintEl.style.opacity = '1';
    hintTimer = 3.2;
  }
});

nextBtn.addEventListener('click', async () => {
  if (!device.enabled) await enableGyro();
  buildLevel(level + 1);
  startPlay();
});

calBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  calibrate();
  hintEl.textContent = '已校准：当前姿势为水平';
  hintEl.style.opacity = '1';
  hintTimer = 1.8;
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  spaceMat.uniforms.uTime.value = now * 0.001;
  glassUniforms.uTime.value = spaceMat.uniforms.uTime.value;
  updateTiltTargets(dt);
  tilt.x = damp(tilt.x, tilt.tx, 11, dt);
  tilt.z = damp(tilt.z, tilt.tz, 11, dt);
  board.rotation.x = tilt.x;
  board.rotation.z = tilt.z;
  glassUniforms.uLightDir.value.copy(key.position).normalize();
  tmpAxis.set(1, 0, 0).applyQuaternion(board.quaternion);
  glassUniforms.uBoardX.value.copy(tmpAxis);
  tmpAxis.set(0, 0, 1).applyQuaternion(board.quaternion);
  glassUniforms.uBoardZ.value.copy(tmpAxis);

  frameCount++;
  if (fall.active) {
    updateFall(dt);
  } else if (playing && !won) {
    let acc = dt;
    while (acc > 0) {
      const s = Math.min(SUB_DT, acc);
      physicsStep(s);
      physSteps++;
      acc -= s;
    }
    if (!fall.active) {
      pos.y = RADIUS;
      ball.position.copy(pos);
      if (contactShadow) contactShadow.position.set(pos.x, 0.003, pos.z);
      elapsed = (now - startTime) / 1000;
      timeLabel.textContent = elapsed.toFixed(1) + ' 秒';
      updateRollSound(Math.hypot(vel.x, vel.z));
      checkWin();
    }
  } else {
    updateRollSound(0);
  }

  if (hintTimer > 0) {
    hintTimer -= dt;
    if (hintTimer <= 0) hintEl.style.opacity = '0';
  }

  renderer.render(scene, camera);
}

// preview on the start screen: already-built maze, ball at start
initThemeAudioUI();
buildLevel(1);
requestAnimationFrame(frame);

// debug hook for automated tests
window.__maze = {
  getState() {
    return {
      playing, won, level, cols, rows,
      ball: fall.active
        ? { x: ball.position.x, y: ball.position.y, z: ball.position.z, world: true }
        : { x: pos.x, y: pos.y, z: pos.z },

      vel: { x: vel.x, z: vel.z },
      tilt: { x: tilt.x, z: tilt.z },
      start: { x: startPos.x, z: startPos.z },
      exit: { x: exitPos.x, z: exitPos.z },
      walls: wallBoxes.length,
      elapsed, frameCount, physSteps, keys: { ...keys },
      maxTilt: MAX_TILT, tiltHold: !!tilt.hold,
      lives, falling: fall.active, gameOver, won,
      gaps: gaps.map((g) => ({ side: g.side, min: g.min, max: g.max })),
      gapWidth: gapWidthFor(level),
      theme: currentThemeId,
      music: audio.musicId
    };
  },
  startPlay,
  buildLevel,
  setTheme: (id) => applyTheme(id),
  getTheme: () => currentThemeId,
  listThemes: () => THEME_ORDER.slice(),
  setMusic: (id) => { unlockAudio(); startMusic(id); },
  setLives(n) { lives = n; updateLivesHUD(); },
  setTilt(x, z) { tilt.hold = true; tilt.tx = x; tilt.tz = z; keys.n = keys.s = keys.e = keys.w = false; },
  press(dir, down = true) { tilt.hold = false; if (keys[dir] !== undefined) keys[dir] = down; },
  placeAtGap() {
    if (!gaps.length) return null;
    const g = gaps[0];
    const { hw, hd } = boardExtent();
    const mid = (g.min + g.max) * 0.5;
    vel.set(0, 0, 0);
    const inset = 0.05;
    const speed = 2.2;
    if (g.side === 'n') { pos.set(mid, RADIUS, -hd + inset); vel.z = -speed; }
    else if (g.side === 's') { pos.set(mid, RADIUS, hd - inset); vel.z = speed; }
    else if (g.side === 'w') { pos.set(-hw + inset, RADIUS, mid); vel.x = -speed; }
    else { pos.set(hw - inset, RADIUS, mid); vel.x = speed; }
    ball.position.copy(pos);
    if (contactShadow) contactShadow.position.set(pos.x, 0.003, pos.z);
    return { side: g.side, min: g.min, max: g.max, pos: { x: pos.x, z: pos.z } };
  },
  penetrating() {
    const r = RADIUS * 0.92;
    let n = 0;
    for (const b of wallBoxes) {
      const cx = Math.min(Math.max(pos.x, b.minX), b.maxX);
      const cz = Math.min(Math.max(pos.z, b.minZ), b.maxZ);
      const dx = pos.x - cx, dz = pos.z - cz;
      if (dx * dx + dz * dz < r * r) n++;
    }
    return n;
  },
  inspectScene() {
    const meshes = [];
    scene.traverse((o) => {
      if (!o.isMesh) return;
      let p = o, inBoard = false;
      while (p) { if (p === board) { inBoard = true; break; } p = p.parent; }
      meshes.push({
        name: o.name || '',
        geom: o.geometry && o.geometry.type,
        inBoard,
        isSpace: o === spaceMesh
      });
    });
    return {
      meshes,
      hasSpace: meshes.some((m) => m.isSpace),
      hasGround: meshes.some((m) => !m.inBoard && !m.isSpace)
    };
  },
  step(seconds) {
    let t = seconds;
    const frameDt = 1 / 60;
    while (t > 0) {
      const dt = Math.min(frameDt, t);
      updateTiltTargets(dt);
      tilt.x = damp(tilt.x, tilt.tx, 11, dt);
      tilt.z = damp(tilt.z, tilt.tz, 11, dt);
      board.rotation.x = tilt.x;
      board.rotation.z = tilt.z;
      glassUniforms.uLightDir.value.copy(key.position).normalize();
      tmpAxis.set(1, 0, 0).applyQuaternion(board.quaternion);
      glassUniforms.uBoardX.value.copy(tmpAxis);
      tmpAxis.set(0, 0, 1).applyQuaternion(board.quaternion);
      glassUniforms.uBoardZ.value.copy(tmpAxis);
      if (fall.active) {
        updateFall(dt);
      } else if (playing && !won) {
        let acc = dt;
        while (acc > 0) {
          const s = Math.min(SUB_DT, acc);
          physicsStep(s);
          physSteps++;
          acc -= s;
        }
        if (!fall.active) {
          pos.y = RADIUS;
          ball.position.copy(pos);
          if (contactShadow) contactShadow.position.set(pos.x, 0.003, pos.z);
          elapsed += dt;
          checkWin();
        }
      }
      t -= dt;
    }
  }
};
</script>
