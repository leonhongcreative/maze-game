}

function filletFor(sx, sz) {
  return Math.min(FILLET, sx * 0.5 * 0.9, sz * 0.5 * 0.9, WALL_H * 0.5 * 0.9);
}

function roundedProto(sx, sy, sz, rf) {
  const key = [sx.toFixed(3), sy.toFixed(3), sz.toFixed(3), rf.toFixed(3)].join('|');
  let g = roundCache.get(key);
  if (!g) {
    g = new RoundedBoxGeometry(Math.max(sx, 0.02), Math.max(sy, 0.02), Math.max(sz, 0.02), 2, Math.max(rf, 0.001));
    roundCache.set(key, g);
  }
  return g;
}

function mergeRuns(list, axis) {
  const groups = new Map();
  for (const s of list) {
    const fixed = axis === 'x' ? s.z : s.x;
    const key = fixed.toFixed(3);
    if (!groups.has(key)) groups.set(key, []);
    const a = axis === 'x' ? s.x - s.sx / 2 : s.z - s.sz / 2;
    const b = axis === 'x' ? s.x + s.sx / 2 : s.z + s.sz / 2;
    groups.get(key).push({ a, b, fixed, thick: axis === 'x' ? s.sz : s.sx });
  }
  const out = [];
  for (const runs of groups.values()) {
    runs.sort((p, q) => p.a - q.a);
    let cur = { ...runs[0] };
    for (let i = 1; i < runs.length; i++) {
      const n = runs[i];
      if (n.a <= cur.b + 0.035) cur.b = Math.max(cur.b, n.b);
      else { out.push(cur); cur = { ...n }; }
    }
    out.push(cur);
  }
  return out.map((r) => (
    axis === 'x'
      ? { x: (r.a + r.b) / 2, z: r.fixed, sx: r.b - r.a, sz: r.thick, axis }
      : { x: r.fixed, z: (r.a + r.b) / 2, sx: r.thick, sz: r.b - r.a, axis }
  ));
}

function extendJoints(walls) {
  const horiz = walls.filter((w) => w.axis === 'x');
  const vert = walls.filter((w) => w.axis === 'z');
  const reach = WALL_T * 0.8;
  for (const h of horiz) {
    let a = h.x - h.sx / 2, b = h.x + h.sx / 2;
    const z0 = h.z - h.sz / 2, z1 = h.z + h.sz / 2;
    for (const v of vert) {
      const overlap = Math.min(z1, v.z + v.sz / 2) - Math.max(z0, v.z - v.sz / 2);
      if (overlap < h.sz * 0.45) continue;
      if (Math.abs(a - v.x) <= reach) a = Math.min(a, v.x - v.sx / 2);
      if (Math.abs(b - v.x) <= reach) b = Math.max(b, v.x + v.sx / 2);
    }
    h.x = (a + b) / 2;
    h.sx = Math.max(0.02, b - a);
  }
  for (const v of vert) {
    let a = v.z - v.sz / 2, b = v.z + v.sz / 2;
    const x0 = v.x - v.sx / 2, x1 = v.x + v.sx / 2;
    for (const h of horiz) {
      const overlap = Math.min(x1, h.x + h.sx / 2) - Math.max(x0, h.x - h.sx / 2);
      if (overlap < v.sx * 0.45) continue;
      if (Math.abs(a - h.z) <= reach) a = Math.min(a, h.z - h.sz / 2);
      if (Math.abs(b - h.z) <= reach) b = Math.max(b, h.z + h.sz / 2);
    }
    v.z = (a + b) / 2;
    v.sz = Math.max(0.02, b - a);
  }
  return walls;
}

function buildWallMesh(specs) {
  const parts = [];
  for (const s of specs) {
    if (s.sx < 0.02 || s.sz < 0.02) continue;
    const rf = filletFor(s.sx, s.sz);
    addBox(s.x - s.sx / 2, s.x + s.sx / 2, s.z - s.sz / 2, s.z + s.sz / 2, rf);
    const g = roundedProto(s.sx, WALL_H, s.sz, rf).clone();
    g.translate(s.x, WALL_H * 0.5, s.z);
    const count = g.attributes.position.count;
    const centers = new Float32Array(count * 3);
    const sizes = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      centers[i * 3] = s.x;
      centers[i * 3 + 1] = WALL_H * 0.5;
      centers[i * 3 + 2] = s.z;
      sizes[i * 3] = s.sx;
      sizes[i * 3 + 1] = WALL_H;
      sizes[i * 3 + 2] = s.sz;
    }
    g.setAttribute('aCenter', new THREE.BufferAttribute(centers, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(sizes, 3));
    parts.push(g);
  }
  if (!parts.length) return;
  const merged = parts.length === 1 ? parts[0] : mergeGeometries(parts, false);
  if (parts.length > 1) parts.forEach((g) => g.dispose());
  wallMesh = new THREE.Mesh(merged, getTheme().wallMat);
  wallMesh.name = 'walls';
  wallMesh.castShadow = true;
  wallMesh.receiveShadow = true;
  mazeRoot.add(wallMesh);
}

// ---------- build / rebuild maze ----------
function clearMaze() {
  if (mazeRoot) {
    board.remove(mazeRoot);
    mazeRoot.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
    });
  }
  wallBoxes = [];
  gaps = [];
  wallMesh = null;
  mazeRoot = new THREE.Group();
  board.add(mazeRoot);
}

function buildLevel(lv) {
  clearMaze();
  level = lv;
  cols = rows = sizeForLevel(lv);
  const cells = generateMaze(cols, rows);
  const ox = (cols - 1) * CELL * 0.5;
  const oz = (rows - 1) * CELL * 0.5;
  const hw = cols * CELL * 0.5;
  const hd = rows * CELL * 0.5;
  const boardW = cols * CELL + WALL_T;
  const boardD = rows * CELL + WALL_T;

  // frosted-glass floor (extends to the outer face of the boundary walls)
  const floor = new THREE.Mesh(new THREE.BoxGeometry(boardW, FLOOR_T, boardD), glassMat);
  floor.name = 'glassFloor';
  floor.position.y = -FLOOR_T * 0.5;
  floor.renderOrder = 0;
  mazeRoot.add(floor);
  glassUniforms.uHalf.value.set(boardW * 0.5, boardD * 0.5);

  planGaps(ox, oz, hw, hd);

  const wallSpecs = [];
  const seen = new Set();
  function wallKey(x, z, sx, sz) {
    return [x.toFixed(3), z.toFixed(3), sx.toFixed(3), sz.toFixed(3)].join('|');
  }
  function addWall(x, z, sx, sz, axis) {
    const k = wallKey(x, z, sx, sz);
    if (seen.has(k)) return;
    seen.add(k);
    wallSpecs.push({ x, z, sx, sz, axis });
  }
  function subtractIntervals(intervals, gmin, gmax) {
    const out = [];
    for (const it of intervals) {
      if (gmax <= it.a || gmin >= it.b) { out.push(it); continue; }
      if (gmin > it.a) out.push({ a: it.a, b: Math.min(gmin, it.b) });
      if (gmax < it.b) out.push({ a: Math.max(gmax, it.a), b: it.b });
    }
    return out;
  }
  function addMaybeGappedWall(x, z, sx, sz, side) {
    const axis = (sz < sx) ? 'x' : 'z';
    if (!side) { addWall(x, z, sx, sz, axis); return; }
    const alongX = (side === 'n' || side === 's');
    let intervals = alongX
      ? [{ a: x - sx * 0.5, b: x + sx * 0.5 }]
      : [{ a: z - sz * 0.5, b: z + sz * 0.5 }];
    for (const g of gaps) {
      if (g.side === side) intervals = subtractIntervals(intervals, g.min, g.max);
    }
    for (const it of intervals) {
      const len = it.b - it.a;
      if (len < 0.025) continue;
      const mid = (it.a + it.b) * 0.5;
      if (alongX) addWall(mid, z, len, WALL_T, 'x');
      else addWall(x, mid, WALL_T, len, 'z');
    }
  }

  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const cx = i * CELL - ox;
      const cz = j * CELL - oz;
      const c = cells[j][i];
      const len = CELL + WALL_T * 0.02;
      if (c.n) addMaybeGappedWall(cx, cz - CELL * 0.5, len, WALL_T, j === 0 ? 'n' : null);
      if (c.s) addMaybeGappedWall(cx, cz + CELL * 0.5, len, WALL_T, j === rows - 1 ? 's' : null);
      if (c.w) addMaybeGappedWall(cx - CELL * 0.5, cz, WALL_T, len, i === 0 ? 'w' : null);
      if (c.e) addMaybeGappedWall(cx + CELL * 0.5, cz, WALL_T, len, i === cols - 1 ? 'e' : null);
    }
  }

  const mergedWalls = extendJoints(mergeRuns(wallSpecs.filter((s) => s.axis === 'x'), 'x').concat(mergeRuns(wallSpecs.filter((s) => s.axis === 'z'), 'z')));
  buildWallMesh(mergedWalls);

  startPos.copy(cellCenter(0, 0));
  exitPos.copy(cellCenter(cols - 1, rows - 1));

  glassUniforms.uHolePos.value.set(startPos.x, startPos.z);
  glassUniforms.uHoleR.value = HOLE_R * 2.05;

  const holeHorizon = new THREE.Mesh(new THREE.CircleGeometry(HOLE_R * 0.31, 32), holeHorizonMat);
  holeHorizon.rotation.x = -Math.PI / 2;
  holeHorizon.position.set(startPos.x, 0.008, startPos.z);
  holeHorizon.renderOrder = 1;
  holeHorizon.name = 'blackHoleHorizon';
  mazeRoot.add(holeHorizon);

  const holeDisk = new THREE.Mesh(new THREE.CircleGeometry(HOLE_R, 80), holeDiskMat);
  holeDisk.rotation.x = -Math.PI / 2;
  holeDisk.position.set(startPos.x, 0.016, startPos.z);
  holeDisk.renderOrder = 1;
  holeDisk.name = 'blackHoleDisk';
  mazeRoot.add(holeDisk);

  holeLight = new THREE.PointLight(0xff8a40, 0.38, 1.25, 2);
  holeLight.position.set(startPos.x, 0.14, startPos.z);
  mazeRoot.add(holeLight);

  const exitPad = new THREE.Mesh(new THREE.CylinderGeometry(CELL * 0.30, CELL * 0.30, 0.02, 24), exitMat);
  exitPad.position.set(exitPos.x, 0.01, exitPos.z);
  exitPad.receiveShadow = true;
  mazeRoot.add(exitPad);
  themeExitRing = new THREE.Mesh(
    new THREE.TorusGeometry(CELL * 0.30, 0.012, 8, 24),
    exitRingMat
  );
  themeExitRing.rotation.x = Math.PI / 2;
  themeExitRing.position.set(exitPos.x, 0.02, exitPos.z);
  mazeRoot.add(themeExitRing);
  themeExitLight = new THREE.PointLight(0xffc060, 0.7, 1.6);
  themeExitLight.position.set(exitPos.x, 0.35, exitPos.z);
  mazeRoot.add(themeExitLight);

  if (!ball) {
    ball = new THREE.Mesh(new THREE.SphereGeometry(RADIUS, 32, 24), ballMat);
    ball.castShadow = true;
    ball.name = 'ball';
    ball.renderOrder = 3;
    board.add(ball);
  }
  if (!contactShadow) {
    const cMat = new THREE.MeshBasicMaterial({
      color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false
    });
    contactShadow = new THREE.Mesh(new THREE.CircleGeometry(RADIUS * 1.7, 24), cMat);
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.y = 0.003;
    contactShadow.renderOrder = 2;
    contactShadow.name = 'contactShadow';
    board.add(contactShadow);
  }
  buildSurfaces(cells);
  resetBall();
  fitCamera();
  updateShadowCamera(boardW);
  updateLevelLabel();
  updateLivesHUD();
  applyTheme(currentThemeId, false);
}

function surfacePlan(lv) {
  if (lv <= 1) return { count: 0, rough: FRICTION, slick: FRICTION, maxLen: 0, cover: 0 };
  const n = lv - 1;
  const dim = sizeForLevel(lv);
  const cover = Math.min(0.07 + (lv - 2) * 0.04, 0.36);
  const maxLen = lv >= 7 ? 3 : 2;
  const avg = maxLen === 3 ? 2.2 : 1.6;
  let count = Math.round(cover * dim * dim / avg);
  count = Math.max(2, Math.min(16, count));
  const drive = G * Math.sin(MAX_TILT);
  const rough = Math.min(2.1 + (n - 1) * 0.34, drive * 0.78);
  const slick = Math.max(0.08, 0.58 - (n - 1) * 0.05);
  return { count, rough, slick, maxLen, cover };
}

function smooth01(t) {
  t = clamp(t, 0, 1);
  return t * t * (3 - 2 * t);
}

function patchWeight(x, z, p) {
  const inside = Math.min(x - p.minX, p.maxX - x, z - p.minZ, p.maxZ - z);
  if (inside >= SURF_BLEND) return 1;
  if (inside <= 0) return 0;
  return smooth01(inside / SURF_BLEND);
}

function boardMapHalf() {
  return { hw: (cols * CELL + WALL_T) * 0.5, hd: (rows * CELL + WALL_T) * 0.5 };
}

function paintSurfaces(clearSafe) {
  surfData.fill(0);
  const { hw, hd } = boardMapHalf();
  const W = hw * 2, D = hd * 2;
  if (patches.length && W > 0 && D > 0) {
    for (let iy = 0; iy < SURF_N; iy++) {
      const z = -hd + (iy + 0.5) / SURF_N * D;
      for (let ix = 0; ix < SURF_N; ix++) {
        const x = -hw + (ix + 0.5) / SURF_N * W;
        let rw = 0, sw = 0, dir = 0, best = 0;
        for (const p of patches) {
          const w = patchWeight(x, z, p);
          if (w <= 0) continue;
          if (p.kind === 'rough') rw = Math.max(rw, w);
          else sw = Math.max(sw, w);
          if (w > best) { best = w; dir = p.axis === 'z' ? 1 : 0; }
        }
        const i = (iy * SURF_N + ix) * 4;
        surfData[i] = (clamp(rw, 0, 1) * 255 + 0.5) | 0;
        surfData[i + 1] = (clamp(sw, 0, 1) * 255 + 0.5) | 0;
        surfData[i + 2] = dir ? 255 : 0;
        surfData[i + 3] = 255;
      }
    }
  }
  if (clearSafe && patches.length) {
    clearDisk(startPos.x, startPos.z, CELL * 0.58);
    clearDisk(exitPos.x, exitPos.z, CELL * 0.58);
  }
  surfTex.needsUpdate = true;
}

function clearDisk(cx, cz, rad) {
  const { hw, hd } = boardMapHalf();
  const W = hw * 2, D = hd * 2;
  const r2 = rad * rad;
  for (let iy = 0; iy < SURF_N; iy++) {
    const z = -hd + (iy + 0.5) / SURF_N * D;
    const dz = z - cz;
    for (let ix = 0; ix < SURF_N; ix++) {
      const x = -hw + (ix + 0.5) / SURF_N * W;
      const dx = x - cx;
      if (dx * dx + dz * dz <= r2) {
        const i = (iy * SURF_N + ix) * 4;
        surfData[i] = 0;
        surfData[i + 1] = 0;
      }
    }
  }
}

function sampleSurf(x, z) {
  const { hw, hd } = boardMapHalf();
  const u = clamp((x + hw) / (hw * 2), 0, 0.999999);
  const v = clamp((z + hd) / (hd * 2), 0, 0.999999);
  const fx = u * SURF_N - 0.5;
  const fy = v * SURF_N - 0.5;
  const x0 = Math.floor(fx);
  const y0 = Math.floor(fy);
  const tx = fx - x0;
  const ty = fy - y0;
  const at = (ix, iy) => {
    ix = clamp(ix, 0, SURF_N - 1) | 0;
    iy = clamp(iy, 0, SURF_N - 1) | 0;
    const i = (iy * SURF_N + ix) * 4;
    return [surfData[i] / 255, surfData[i + 1] / 255];
  };
  const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
  const lerp = (p, q, t) => p + (q - p) * t;
  return {
    rough: lerp(lerp(a[0], b[0], tx), lerp(c[0], d[0], tx), ty),
    slick: lerp(lerp(a[1], b[1], tx), lerp(c[1], d[1], tx), ty)
  };
}

function frictionAt(x, z) {
  if (!patches.length) return FRICTION;
  const s = sampleSurf(x, z);
  const sum = s.rough + s.slick;
  const k = clamp(sum, 0, 1);
  if (k < 1e-4) return FRICTION;
  const mix = (s.rough * surfacePlanNow.rough + s.slick * surfacePlanNow.slick) / sum;
  return FRICTION * (1 - k) + mix * k;
}

function buildSurfaces(cells) {
  const plan = surfacePlan(level);
  surfacePlanNow = plan;
  patches = [];
  wallsEnabled = true;
  if (!plan.count) {
    paintSurfaces(false);
    updateLegend(false);
    return;
  }
  const blocked = new Set();
  const mark = (i, j) => { if (i >= 0 && j >= 0 && i < cols && j < rows) blocked.add(i + ',' + j); };
  for (const [i, j] of [[0, 0], [cols - 1, rows - 1]]) {
    mark(i, j); mark(i + 1, j); mark(i - 1, j); mark(i, j + 1); mark(i, j - 1);
  }
  const runs = [];
  for (let j = 0; j < rows; j++) {
    let run = [];
    for (let i = 0; i < cols; i++) {
      run.push([i, j]);
      if (!(i + 1 < cols && !cells[j][i].e)) { runs.push({ axis: 'x', cells: run }); run = []; }
    }
  }
  for (let i = 0; i < cols; i++) {
    let run = [];
    for (let j = 0; j < rows; j++) {
      run.push([i, j]);
      if (!(j + 1 < rows && !cells[j][i].s)) { runs.push({ axis: 'z', cells: run }); run = []; }
    }
  }
  const cands = [];
  for (const run of runs) {
    for (let len = 1; len <= plan.maxLen; len++) {
      for (let s = 0; s + len <= run.cells.length; s++) {
        const slice = run.cells.slice(s, s + len);
        if (slice.some(([i, j]) => blocked.has(i + ',' + j))) continue;
        cands.push({ axis: run.axis, cells: slice });
      }
    }
  }
  for (let i = cands.length - 1; i > 0; i--) {
    const k = (Math.random() * (i + 1)) | 0;
    const tmp = cands[i]; cands[i] = cands[k]; cands[k] = tmp;
  }
  cands.sort((a, b) => b.cells.length - a.cells.length);
  const used = new Set();
  let toggle = 0;
  for (const c of cands) {
    if (patches.length >= plan.count) break;
    if (c.cells.some(([i, j]) => used.has(i + ',' + j))) continue;
    const kind = (toggle++ % 2 === 0) ? 'rough' : 'slick';
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (const [i, j] of c.cells) {
      used.add(i + ',' + j);
      const ctr = cellCenter(i, j);
      const m = CELL * 0.46;
      minX = Math.min(minX, ctr.x - m);
      maxX = Math.max(maxX, ctr.x + m);
      minZ = Math.min(minZ, ctr.z - m);
      maxZ = Math.max(maxZ, ctr.z + m);
    }
    patches.push({
      minX, maxX, minZ, maxZ, kind, axis: c.axis,
      mu: kind === 'rough' ? plan.rough : plan.slick
    });
  }
  paintSurfaces(true);
  updateLegend(patches.length > 0);
}

function updateLegend(on) {
  const el = document.getElementById('legend');
  if (el) el.hidden = !on;
}

function planGaps(ox, oz, hw, hd) {
  gaps = [];
  const width = gapWidthFor(level);
  const want = gapCountFor(level);
  const eligible = [];
  for (let i = 0; i < cols; i++) {
    if (i !== 0) eligible.push({ side: 'n', center: i * CELL - ox });
    if (i !== cols - 1) eligible.push({ side: 's', center: i * CELL - ox });
  }
  for (let j = 0; j < rows; j++) {
    if (j !== 0) eligible.push({ side: 'w', center: j * CELL - oz });
    if (j !== rows - 1) eligible.push({ side: 'e', center: j * CELL - oz });
  }
  // shuffle
  for (let i = eligible.length - 1; i > 0; i--) {
    const k = (Math.random() * (i + 1)) | 0;
    const tmp = eligible[i]; eligible[i] = eligible[k]; eligible[k] = tmp;
  }
  function protectedRange(side) {
    if (side === 'n') return [-hw, -hw + CELL];
    if (side === 'w') return [-hd, -hd + CELL];
    if (side === 's') return [hw - CELL, hw];
    if (side === 'e') return [hd - CELL, hd];
    return [0, 0];
  }
  function overlaps(side, a, b) {
    for (const g of gaps) {
      if (g.side !== side) continue;
      if (!(b <= g.min || a >= g.max)) return true;
    }
    const [p0, p1] = protectedRange(side);
    if (!(b <= p0 || a >= p1)) return true;
    return false;
  }
  for (const e of eligible) {
    if (gaps.length >= want) break;
    let a = e.center - width * 0.5;
    let b = e.center + width * 0.5;
    const limit = (e.side === 'n' || e.side === 's') ? hw : hd;
    a = Math.max(a, -limit + 0.02);
    b = Math.min(b,  limit - 0.02);
    if (b - a < width * 0.45) continue;
    if (overlaps(e.side, a, b)) continue;
    gaps.push({ side: e.side, min: a, max: b });
  }
}

function updateLevelLabel() {
  const el = document.getElementById('levelLabel');
  const bits = ['第 ' + level + ' 关', '难度 ' + level];
  if (gaps.length) bits.push('开口 ' + gaps.length);
  el.textContent = bits.join(' · ');
  el.classList.remove('tick');
  void el.offsetWidth;
  el.classList.add('tick');
}

function updateLivesHUD() {
  const el = document.getElementById('pips');
  if (!el) return;
  const lostAt = lives < livesShown ? lives : -1;
  el.replaceChildren();
  for (let i = 0; i < MAX_LIVES; i++) {
    const pip = document.createElement('span');
    pip.className = 'pip' + (i < lives ? '' : ' off') + (i === lostAt ? ' just' : '');
    el.appendChild(pip);
  }
  livesShown = lives;
  const row = el.parentElement;
  if (row) row.setAttribute('aria-label', '生命 ' + lives + ' / ' + MAX_LIVES);
}

function updateShadowCamera(boardW) {
  const s = boardW * 0.7 + 1.2;
  const cam = key.shadow.camera;
  cam.left = -s; cam.right = s; cam.top = s; cam.bottom = -s;
  cam.updateProjectionMatrix();
  key.position.set(s * 0.55, s * 1.15, s * 0.4);
}

function fitCamera() {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  const boardW = cols * CELL + WALL_T;
  camera.fov = aspect < 0.72 ? 50 : 42;
  const half = boardW * 0.55;
  const vFit = half / Math.tan(degToRad(camera.fov * 0.5));
  const hFit = half / Math.tan(degToRad(camera.fov * 0.5)) / aspect;
  const dist = Math.max(vFit, hFit) * 1.14;
  camera.position.set(0, dist * 0.98, dist * 0.2);
  camera.lookAt(0, 0, 0);
  camera.near = 0.05;
  camera.far = dist * 5;
  camera.updateProjectionMatrix();
}

function finishSpawn() {
  // End the emerge cinematic only. Do not teleport or zero velocity, so
  // tests / placeAtGap can move the ball while a spawn was still running.
  spawn.active = false;
  spawn.t = spawn.dur;
  if (!ball) return;
  ball.scale.setScalar(1);
  ball.rotation.set(0, 0, 0);
  ball.visible = true;
  pos.y = RADIUS;
  ball.position.x = pos.x;
  ball.position.y = pos.y;
  ball.position.z = pos.z;
  if (contactShadow) {
    contactShadow.scale.setScalar(1);
    contactShadow.position.set(pos.x, 0.003, pos.z);
    const dHole = Math.hypot(pos.x - startPos.x, pos.z - startPos.z);
    const fade = Math.min(1, Math.max(0, (dHole - 0.06) / 0.18));
    contactShadow.material.opacity = 0.45 * fade;
    contactShadow.visible = fade > 0.03;
  }
}

function motionReduced() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function startSpawn() {
  spawn.active = true;
  spawn.t = 0;
  spawn.dur = motionReduced() ? 0.01 : 0.85;
  if (!ball) return;
  if (ball.parent !== board) board.add(ball);
  ball.visible = true;
  ball.scale.setScalar(0.001);
  ball.quaternion.identity();
  pos.copy(startPos);
  pos.y = RADIUS * 0.12;
  vel.set(0, 0, 0);
  ball.position.copy(pos);
  if (contactShadow) {
    contactShadow.visible = false;
    contactShadow.material.opacity = 0;
    contactShadow.scale.setScalar(0.001);
  }
}

function updateSpawn(dt) {
  if (!spawn.active) return;
  spawn.t += dt;
  const u = Math.min(1, spawn.t / spawn.dur);
  const ease = 1 - Math.pow(1 - u, 3);
  const swirl = motionReduced() ? 0 : (1 - ease) * Math.PI * 2.4;
  ball.scale.setScalar(Math.max(0.001, ease));
  ball.rotation.y = swirl;
  pos.copy(startPos);
  pos.y = RADIUS * (0.12 + 0.88 * ease);
  ball.position.copy(pos);
  if (contactShadow) {
    const op = Math.max(0, (u - 0.4) / 0.6) * 0.45;
    contactShadow.visible = op > 0.02;
    contactShadow.material.opacity = op;
    contactShadow.scale.setScalar(Math.max(0.001, ease));
    contactShadow.position.set(pos.x, 0.003, pos.z);
  }
  if (u >= 1) finishSpawn();
}

function resetBall(animate = false) {
  if (ball && ball.parent !== board) board.add(ball);
  ball.visible = true;
  pos.copy(startPos);
  vel.set(0, 0, 0);
  ball.quaternion.identity();
  tilt.x = tilt.z = tilt.tx = tilt.tz = 0;
  tilt.hold = false;
  board.rotation.set(0, 0, 0);
  won = false;
  falling = false;
  fall.active = false;
  fall.t = 0;
  if (animate) startSpawn();
  else finishSpawn();
}

// ---------- physics ----------
function pushOut(b, reach, bestImpact) {
  const minX = b.minX + b.rf, maxX = b.maxX - b.rf;
  const minZ = b.minZ + b.rf, maxZ = b.maxZ - b.rf;
  const left = pos.x - minX, right = maxX - pos.x;
  const top = pos.z - minZ, bot = maxZ - pos.z;
  const m = Math.min(left, right, top, bot);
  if (m === left) { pos.x = minX - reach; if (vel.x > 0) { bestImpact = Math.max(bestImpact, vel.x); vel.x = -vel.x * RESTITUTION; } }
  else if (m === right) { pos.x = maxX + reach; if (vel.x < 0) { bestImpact = Math.max(bestImpact, -vel.x); vel.x = -vel.x * RESTITUTION; } }
  else if (m === top) { pos.z = minZ - reach; if (vel.z > 0) { bestImpact = Math.max(bestImpact, vel.z); vel.z = -vel.z * RESTITUTION; } }
  else { pos.z = maxZ + reach; if (vel.z < 0) { bestImpact = Math.max(bestImpact, -vel.z); vel.z = -vel.z * RESTITUTION; } }
  return bestImpact;
}

function collideWalls() {
  const rBall = RADIUS * 0.98;
  let bestImpact = 0;
  for (let n = 0; n < 4; n++) {
    let hit = false;
    for (const b of wallBoxes) {
      const rf = b.rf || 0;
      const minX = b.minX + rf, maxX = b.maxX - rf;
      const minZ = b.minZ + rf, maxZ = b.maxZ - rf;
      if (maxX - minX < 1e-4 || maxZ - minZ < 1e-4) continue;
      const reach = rBall + rf;
      const cx = clamp(pos.x, minX, maxX);
      const cz = clamp(pos.z, minZ, maxZ);
      const dx = pos.x - cx, dz = pos.z - cz;
      const d2 = dx * dx + dz * dz;
      if (d2 >= reach * reach) continue;
      if (d2 < 1e-12) {
        bestImpact = pushOut(b, reach, bestImpact);
        hit = true;
        continue;
      }
      const d = Math.sqrt(d2);
      const nx = dx / d, nz = dz / d;
      pos.x += nx * (reach - d);
      pos.z += nz * (reach - d);
      const vn = vel.x * nx + vel.z * nz;
      if (vn < 0) {
        bestImpact = Math.max(bestImpact, -vn);
        vel.x -= (1 + RESTITUTION) * vn * nx;
        vel.z -= (1 + RESTITUTION) * vn * nz;
      }
      hit = true;
    }
    if (!hit) break;
  }
  if (bestImpact > 0.45) playHit(bestImpact);
}

function physicsStep(dt) {
  if (fall.active || falling) return;
  vel.x += G * Math.sin(tilt.z) * dt;
  vel.z += -G * Math.sin(tilt.x) * dt;

  const mu = frictionAt(pos.x, pos.z);
  const sp = Math.hypot(vel.x, vel.z);
  if (sp > 1e-6) {
    const ns = Math.max(0, sp - mu * dt);
    const dampK = 0.22 * (mu / FRICTION);
    const nd = ns * Math.exp(-dampK * dt);
    vel.x *= nd / sp;
    vel.z *= nd / sp;
  }
  const sp2 = Math.hypot(vel.x, vel.z);
  if (sp2 > MAX_SPEED) {
    vel.x *= MAX_SPEED / sp2;
    vel.z *= MAX_SPEED / sp2;
  }

  pos.x += vel.x * dt;
  pos.z += vel.z * dt;
  if (wallsEnabled) {
    collideWalls();
    checkFall();
  }

  const sp3 = Math.hypot(vel.x, vel.z);
  if (sp3 > 1e-5) {
    tmpAxis.set(vel.z, 0, -vel.x).normalize();
    tmpQ.setFromAxisAngle(tmpAxis, (sp3 / RADIUS) * dt);
    ball.quaternion.premultiply(tmpQ);
  }
}

function inGap(side, along) {
  for (const g of gaps) {
    if (g.side === side && along >= g.min && along <= g.max) return true;
  }
  return false;
}

function checkFall() {
  if (falling || fall.active || won || !playing) return;
  const { hw, hd } = boardExtent();
  if (pos.z < -hd) { if (inGap('n', pos.x)) beginFall(); }
  else if (pos.z > hd) { if (inGap('s', pos.x)) beginFall(); }
  else if (pos.x < -hw) { if (inGap('w', pos.z)) beginFall(); }
  else if (pos.x > hw) { if (inGap('e', pos.z)) beginFall(); }
}

function beginFall() {
  falling = true;
  playing = false;
  fall.active = true;
  fall.t = 0;
  board.updateMatrixWorld(true);
  ball.getWorldPosition(fall.startPos);
  tmpV.set(vel.x, 0, vel.z).applyQuaternion(board.quaternion);
  fall.startVel.copy(tmpV);
  ball.getWorldQuaternion(fall.startQuat);
  scene.add(ball);
  ball.position.copy(fall.startPos);
  ball.quaternion.copy(fall.startQuat);
  if (contactShadow) contactShadow.visible = false;
  playFallWhoosh();
}

function updateFall(dt) {
  if (!fall.active) return;
  fall.t += dt;
  const u = Math.min(1, fall.t / fall.dur);
  const ease = u * u;
  const p = tmpV.copy(fall.startPos);
  p.x += fall.startVel.x * fall.t;
  p.z += fall.startVel.z * fall.t;
  p.y += fall.startVel.y * fall.t - 0.5 * 8.8 * fall.t * fall.t - ease * 1.4;
  ball.position.copy(p);
  const s = Math.max(0.05, 1 - ease * 0.93);
  ball.scale.setScalar(s);
  ball.rotateOnWorldAxis(tmpAxis.set(0.35, 0.2, 0.9).normalize(), dt * 3.2);
  if (u >= 1) finishFall();
}

function finishFall() {
  fall.active = false;
  falling = false;
  lives = Math.max(0, lives - 1);
  updateLivesHUD();
  ball.scale.setScalar(1);
  board.add(ball);
  if (lives <= 0) {
    showGameOver();
  } else {
    resetBall(true);
    playing = true;
    startTime = performance.now();
    elapsed = 0;
    timeLabel.textContent = '0.0 秒';
    hintEl.textContent = '剩余生命 ' + lives + '。从起点再出发。';
    hintEl.style.opacity = '1';
    hintTimer = 2.2;
  }
}

function checkWin() {
  const dx = pos.x - exitPos.x, dz = pos.z - exitPos.z;
  if (dx * dx + dz * dz < (CELL * 0.26) * (CELL * 0.26)) {
    won = true;
    playing = false;
    elapsed = (performance.now() - startTime) / 1000;
    showWin();
  }
}

// ---------- controls ----------
function applyDeviceTilt(beta, gamma) {
  device.hasEvent = true;
  device.rawBeta = beta || 0;
  device.rawGamma = gamma || 0;
  if (device.needCal) {
    device.calBeta = device.rawBeta;
    device.calGamma = device.rawGamma;
    device.smBeta = device.rawBeta;
    device.smGamma = device.rawGamma;
    device.needCal = false;
  }
}

function calibrate() {
  device.calBeta = device.rawBeta;
  device.calGamma = device.rawGamma;
  device.needCal = false;
}

function onOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  if (!device.enabled) {
    device.enabled = true;
    if (playing) {
      calBtn.style.display = 'block';
      hintEl.textContent = '倾斜手机控制木盒 · 可点「校准水平」';
      hintEl.style.opacity = '1';
      hintTimer = 3.2;
    }
  }
  applyDeviceTilt(e.beta, e.gamma);
}

function updateTiltTargets(dt) {
  // device
  let dx = 0, dz = 0, fromDevice = false;
  if (device.enabled && device.hasEvent) {
    device.smBeta = damp(device.smBeta, device.rawBeta, 10, dt);
    device.smGamma = damp(device.smGamma, device.rawGamma, 10, dt);
    let db = device.smBeta - device.calBeta;
    let dg = device.smGamma - device.calGamma;
    const mag = Math.hypot(db, dg);
    if (mag < DEAD_ZONE) { db = 0; dg = 0; }
    else {
      const s = (mag - DEAD_ZONE) / mag;
      db *= s; dg *= s;
    }
    // 手机平放、屏幕朝上：右边缘下压（gamma>0）球向右；顶端下压（beta<0）球向上远离自己
    dz = clamp(degToRad(dg) * TILT_SENS, -MAX_TILT, MAX_TILT);
    dx = clamp(degToRad(-db) * TILT_SENS, -MAX_TILT, MAX_TILT);
    fromDevice = true;
  }

  // keyboard / WASD
  let kx = 0, kz = 0;
  if (keys.n) kx += 1;
  if (keys.s) kx -= 1;
  if (keys.e) kz += 1;
  if (keys.w) kz -= 1;
  if (kx || kz) {
    const len = Math.hypot(kx, kz) || 1;
    kx /= len; kz /= len;
    dx = kx * MAX_TILT;
    dz = kz * MAX_TILT;
    fromDevice = false;
  } else if (drag.active) {
    dx = drag.x;
    dz = drag.z;
    fromDevice = false;
  } else if (tilt.hold) {
    dx = tilt.tx;
    dz = tilt.tz;
    fromDevice = false;
  } else if (!fromDevice) {
    dx = 0; dz = 0;
  }

  tilt.tx = dx;
  tilt.tz = dz;
}

function isTouchPhone() {
  return /iPhone|iPad|iPod|Android|Mobile|MicroMessenger/i.test(navigator.userAgent || '');
}

async function enableGyro() {
  let listen = false;
  try {
    const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    if (isiOS && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const perm = await DeviceOrientationEvent.requestPermission();
      listen = perm === 'granted';
    } else if (isTouchPhone() && typeof DeviceOrientationEvent !== 'undefined') {
      listen = true;
    }
  } catch (err) {
    listen = false;
  }
  if (listen) {
    device.listening = true;
    device.needCal = true;
    window.removeEventListener('deviceorientation', onOrientation, true);
    window.addEventListener('deviceorientation', onOrientation, true);
  }
  return listen;
}

// keyboard
const keyMap = {
  ArrowUp: 'n', KeyW: 'n',
  ArrowDown: 's', KeyS: 's',
  ArrowLeft: 'w', KeyA: 'w',
  ArrowRight: 'e', KeyD: 'e'
};
addEventListener('pointerdown', () => { unlockAudio(); }, { passive: true });

addEventListener('keydown', (e) => {
  const k = keyMap[e.code];
  if (!k) return;
  keys[k] = true;
  e.preventDefault();
});
addEventListener('keyup', (e) => {
  const k = keyMap[e.code];
  if (!k) return;
  keys[k] = false;
  e.preventDefault();
});

// mouse / touch drag (desktop & fallback)
function pointerPos(e) {
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function onPointerDown(e) {
  if (!playing || e.target.closest('button, #sheet, #overlay, #sheetBak')) return;
  const p = pointerPos(e);
  drag.active = true;
  drag.sx = p.x; drag.sy = p.y;
  drag.x = 0; drag.z = 0;
}
function onPointerMove(e) {
  if (!drag.active) return;
  const p = pointerPos(e);
  const nx = (p.x - drag.sx) / Math.max(160, innerWidth * 0.28);
  const ny = (p.y - drag.sy) / Math.max(160, innerHeight * 0.28);
  drag.z = clamp(nx * MAX_TILT, -MAX_TILT, MAX_TILT);
  drag.x = clamp(-ny * MAX_TILT, -MAX_TILT, MAX_TILT);
}
function onPointerUp() {
  drag.active = false;
  drag.x = 0; drag.z = 0;
}
const canvas = renderer.domElement;
canvas.addEventListener('mousedown', onPointerDown);
addEventListener('mousemove', onPointerMove);
addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
addEventListener('touchmove', (e) => { if (playing) e.preventDefault(); onPointerMove(e); }, { passive: false });
addEventListener('touchend', onPointerUp);
addEventListener('touchcancel', onPointerUp);
addEventListener('touchmove', (e) => { if (e.target === canvas || playing) e.preventDefault(); }, { passive: false });
addEventListener('gesturestart', (e) => e.preventDefault());

addEventListener('resize', () => {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
});
try { screen.orientation?.lock?.('portrait').catch(() => {}); } catch (e) {}

// ---------- UI / game flow ----------
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const cardSub = document.getElementById('cardSub');
const cardStat = document.getElementById('cardStat');
const timeLabel = document.getElementById('timeLabel');
const hintEl = document.getElementById('hint');
const calBtn = document.getElementById('calibrate');

function hideOverlay() { overlay.classList.add('hidden'); }
function showOverlay() { overlay.classList.remove('hidden'); }

function startPlay() {
  resetBall(true);
  playing = true;
  won = false;
  gameOver = false;
  startTime = performance.now();
  elapsed = 0;
  timeLabel.textContent = '0.0 秒';
  hideOverlay();
  updateLivesHUD();
  const gyro = device.listening || device.enabled;
  calBtn.style.display = gyro ? 'block' : 'none';
  hintEl.style.opacity = '1';
  const surfaceNote = patches.length ? '涩段好刹，滑段会滑。' : '避开外墙开口。';
  hintEl.textContent = gyro
    ? '倾斜手机。' + surfaceNote
    : '方向键、WASD 或拖动。' + surfaceNote;
  hintTimer = 3.4;
}

function showWin() {
  document.getElementById('settingsAlt').hidden = true;
  document.getElementById('cardTitle').textContent = '走出迷宫';
  cardSub.textContent = '小球到达出口。';
  cardStat.hidden = false;
  cardStat.textContent = '用时 ' + elapsed.toFixed(1) + ' 秒';
  startBtn.textContent = '再玩一次';
  nextBtn.hidden = false;
  nextBtn.textContent = '下一关';
  calBtn.style.display = 'none';
  showOverlay();
  playWin();
}

function showGameOver() {
  gameOver = true;
  playing = false;
  document.getElementById('settingsAlt').hidden = true;
  document.getElementById('cardTitle').textContent = '游戏结束';
  cardSub.textContent = '生命用尽，掉入了星空。';
  cardStat.hidden = false;
  cardStat.textContent = '到达第 ' + level + ' 关';
  startBtn.textContent = '重新开始';
  nextBtn.hidden = true;
  calBtn.style.display = 'none';
  showOverlay();
  playGameOver();
}

startBtn.addEventListener('click', async () => {
  unlockAudio();
  const gyro = await enableGyro();
  if (gameOver) {
    lives = MAX_LIVES;
    gameOver = false;
    buildLevel(level);
    startPlay();
  } else if (!playing || won) {
    if (!won) lives = MAX_LIVES;
    startPlay();
  }
  if (!gyro && !device.enabled && isTouchPhone()) {
    hintEl.textContent = '未获得陀螺仪权限，可拖动屏幕来倾斜木盒';
    hintEl.style.opacity = '1';
    hintTimer = 3.2;
  }
});

nextBtn.addEventListener('click', async () => {
  if (!device.enabled) await enableGyro();
  buildLevel(level + 1);
  startPlay();
});

calBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  calibrate();
  hintEl.textContent = '已校准：当前姿势为水平';
  hintEl.style.opacity = '1';
  hintTimer = 1.8;
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  spaceMat.uniforms.uTime.value = now * 0.001;
  glassUniforms.uTime.value = spaceMat.uniforms.uTime.value;
  holeUniforms.uTime.value = spaceMat.uniforms.uTime.value;
  jadeUniforms.uTime.value = spaceMat.uniforms.uTime.value;
  updateTiltTargets(dt);
  tilt.x = damp(tilt.x, tilt.tx, 11, dt);
  tilt.z = damp(tilt.z, tilt.tz, 11, dt);
  board.rotation.x = tilt.x;
  board.rotation.z = tilt.z;
  glassUniforms.uLightDir.value.copy(key.position).normalize();
  tmpAxis.set(1, 0, 0).applyQuaternion(board.quaternion);
  glassUniforms.uBoardX.value.copy(tmpAxis);
  tmpAxis.set(0, 0, 1).applyQuaternion(board.quaternion);
  glassUniforms.uBoardZ.value.copy(tmpAxis);
  board.updateMatrixWorld(true);
  if (wallMesh) jadeUniforms.uInvModel.value.copy(wallMesh.matrixWorld).invert();

  frameCount++;
  if (fall.active) {
    updateFall(dt);
  } else if (spawn.active) {
    updateSpawn(dt);
    updateRollSound(0);
  } else if (playing && !won) {
    let acc = dt;
    while (acc > 0) {
      const s = Math.min(SUB_DT, acc);
      physicsStep(s);
      physSteps++;
      acc -= s;
    }
    if (!fall.active && !spawn.active) {
      pos.y = RADIUS;
      ball.position.copy(pos);
      if (contactShadow) {
        contactShadow.position.set(pos.x, 0.003, pos.z);
        const dHole = Math.hypot(pos.x - startPos.x, pos.z - startPos.z);
        const fade = Math.min(1, Math.max(0, (dHole - 0.06) / 0.18));
        contactShadow.material.opacity = 0.45 * fade;
        contactShadow.visible = fade > 0.03;
      }
      elapsed = (now - startTime) / 1000;
      timeLabel.textContent = elapsed.toFixed(1) + ' 秒';
      updateRollSound(Math.hypot(vel.x, vel.z));
      checkWin();
    }
  } else {
    updateRollSound(0);
  }

  if (hintTimer > 0) {
    hintTimer -= dt;
    if (hintTimer <= 0) hintEl.style.opacity = '0';
  }

  renderer.render(scene, camera);
}

// preview on the start screen: already-built maze, ball at start
initThemeAudioUI();
buildLevel(1);
requestAnimationFrame(frame);

// debug hook for automated tests
window.__maze = {
  getState() {
    return {
      playing, won, level, cols, rows,
      ball: fall.active
        ? { x: ball.position.x, y: ball.position.y, z: ball.position.z, world: true }
        : { x: pos.x, y: pos.y, z: pos.z },

      vel: { x: vel.x, z: vel.z },
      tilt: { x: tilt.x, z: tilt.z },
      start: { x: startPos.x, z: startPos.z },
      exit: { x: exitPos.x, z: exitPos.z },
      walls: wallBoxes.length,
      elapsed, frameCount, physSteps, keys: { ...keys },
      maxTilt: MAX_TILT, tiltHold: !!tilt.hold,
      lives, falling: fall.active, gameOver, won,
      gaps: gaps.map((g) => ({ side: g.side, min: g.min, max: g.max })),
      gapWidth: gapWidthFor(level),
      theme: currentThemeId,
      music: audio.musicId,
      spawning: spawn.active,
      spawnT: spawn.t
    };
  },
  startPlay,
  buildLevel,
  setSpawnT(u) {
    startSpawn();
    spawn.t = Math.max(0, Math.min(1, u)) * spawn.dur;
    updateSpawn(0);
  },
  lookAtStart(dist = 1.15) {
    camera.position.set(startPos.x + dist * 0.12, dist * 0.72, startPos.z + dist * 0.62);
    camera.lookAt(startPos.x, 0.02, startPos.z);
    camera.updateProjectionMatrix();
  },
  fitCamera,
  setTheme: (id) => applyTheme(id),
  getTheme: () => currentThemeId,
  listThemes: () => THEME_ORDER.slice(),
  setMusic: (id) => { unlockAudio(); startMusic(id); },
  setLives(n) { lives = n; updateLivesHUD(); },
  setTilt(x, z) { tilt.hold = true; tilt.tx = x; tilt.tz = z; keys.n = keys.s = keys.e = keys.w = false; },
  press(dir, down = true) { tilt.hold = false; if (keys[dir] !== undefined) keys[dir] = down; },
  placeAtGap() {
    if (!gaps.length) return null;
    if (spawn.active) finishSpawn();
    const g = gaps[0];
    const { hw, hd } = boardExtent();
    const mid = (g.min + g.max) * 0.5;
    vel.set(0, 0, 0);
    const inset = 0.05;
    const speed = 2.2;
    if (g.side === 'n') { pos.set(mid, RADIUS, -hd + inset); vel.z = -speed; }
    else if (g.side === 's') { pos.set(mid, RADIUS, hd - inset); vel.z = speed; }
    else if (g.side === 'w') { pos.set(-hw + inset, RADIUS, mid); vel.x = -speed; }
    else { pos.set(hw - inset, RADIUS, mid); vel.x = speed; }
    ball.position.copy(pos);
    if (contactShadow) contactShadow.position.set(pos.x, 0.003, pos.z);
    return { side: g.side, min: g.min, max: g.max, pos: { x: pos.x, z: pos.z } };
  },
  penetrating() {
    const rBall = RADIUS * 0.92;
    let n = 0;
    for (const b of wallBoxes) {
      const rf = b.rf || 0;
      const minX = b.minX + rf, maxX = b.maxX - rf;
      const minZ = b.minZ + rf, maxZ = b.maxZ - rf;
      const reach = rBall + rf;
      const cx = Math.min(Math.max(pos.x, minX), maxX);
      const cz = Math.min(Math.max(pos.z, minZ), maxZ);
      const dx = pos.x - cx, dz = pos.z - cz;
      if (dx * dx + dz * dz < reach * reach - 1e-4) n++;
    }
    return n;
  },
  place(x, z, vx = 0, vz = 0) {
    if (spawn.active) finishSpawn();
    pos.set(x, RADIUS, z);
    vel.set(vx, 0, vz);
    ball.position.copy(pos);
    if (contactShadow) contactShadow.position.set(x, 0.003, z);
  },
  placeNearExit() {
    if (spawn.active) finishSpawn();
    pos.set(exitPos.x, RADIUS, exitPos.z);
    vel.set(0, 0, 0);
    ball.position.copy(pos);
  },
  frictionAt,
  surfacePlan,
  getPatches() {
    return patches.map((p) => ({
      minX: p.minX, maxX: p.maxX, minZ: p.minZ, maxZ: p.maxZ,
      kind: p.kind, axis: p.axis, mu: p.mu
    }));
  },
  surfaceSig() {
    return JSON.stringify({
      rough: +surfacePlanNow.rough.toFixed(4),
      slick: +surfacePlanNow.slick.toFixed(4),
      n: patches.length,
      p: patches.map((p) => [p.kind, +p.minX.toFixed(3), +p.maxX.toFixed(3), +p.minZ.toFixed(3), +p.maxZ.toFixed(3)])
    });
  },
  defineSurfaces(list, mus = {}) {
    surfacePlanNow = {
      count: list.length,
      rough: mus.rough ?? 3.4,
      slick: mus.slick ?? 0.2,
      maxLen: 2,
      cover: 0
    };
    patches = list.map((p) => ({
      minX: p.minX, maxX: p.maxX, minZ: p.minZ, maxZ: p.maxZ,
      kind: p.kind, axis: p.axis || 'x',
      mu: p.kind === 'slick' ? surfacePlanNow.slick : surfacePlanNow.rough
    }));
    paintSurfaces(false);
    updateLegend(patches.length > 0);
  },
  setWallsEnabled(on) { wallsEnabled = !!on; },
  wallMetrics() {
    if (!wallMesh || !wallBoxes.length) return null;
    const b = wallBoxes.find((w) => Math.max(w.maxX - w.minX, w.maxZ - w.minZ) > 0.45) || wallBoxes[0];
    const attr = wallMesh.geometry.attributes.position;
    const cx = b.maxX, cy = WALL_H, cz = b.maxZ;
    let nearest = Infinity;
    for (let v = 0; v < attr.count; v++) {
      const x = attr.getX(v), y = attr.getY(v), z = attr.getZ(v);
      if (x < b.minX - 0.02 || x > b.maxX + 0.02 || z < b.minZ - 0.02 || z > b.maxZ + 0.02) continue;
      const d = Math.hypot(x - cx, y - cy, z - cz);
      if (d < nearest) nearest = d;
    }
    return {
      walls: wallBoxes.length,
      verts: attr.count,
      fillet: b.rf,
      cornerGap: nearest,
      geom: wallMesh.geometry.type
    };
  },
  focusCorner() {
    const b = wallBoxes.find((w) => (w.maxX - w.minX) > 0.5) || wallBoxes[0];
    const x = b.maxX, z = (b.minZ + b.maxZ) * 0.5;
    camera.position.set(x + 0.28, WALL_H + 0.22, z + 0.34);
    camera.lookAt(x - 0.05, WALL_H * 0.62, z);
    camera.near = 0.01;
    camera.updateProjectionMatrix();
  },
  openSettings: openSheet,
  closeSettings: closeSheet,
  audioState() {
    return {
      unlocked: audio.unlocked,
      musicId: audio.musicId,
      musicVol: audio.musicVol,
      sfxOn: audio.sfxOn,
      sfxVol: audio.sfxVol,
      hasCtx: !!audio.ctx
    };
  },
  render() { renderer.render(scene, camera); },
  pump(time) {
    spaceMat.uniforms.uTime.value = time;
    glassUniforms.uTime.value = time;
    holeUniforms.uTime.value = time;
    jadeUniforms.uTime.value = time;
    board.updateMatrixWorld(true);
    if (wallMesh) jadeUniforms.uInvModel.value.copy(wallMesh.matrixWorld).invert();
    renderer.render(scene, camera);
  },
  readPixel(nx, ny) {
    const gl = renderer.getContext();
    const x = clamp((nx * gl.drawingBufferWidth) | 0, 0, gl.drawingBufferWidth - 1);
    const y = clamp(((1 - ny) * gl.drawingBufferHeight) | 0, 0, gl.drawingBufferHeight - 1);
    const buf = new Uint8Array(4);
    gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    return [buf[0], buf[1], buf[2], buf[3]];
  },
  inspectScene() {
    const meshes = [];
    scene.traverse((o) => {
      if (!o.isMesh) return;
      let p = o, inBoard = false;
      while (p) { if (p === board) { inBoard = true; break; } p = p.parent; }
      meshes.push({
        name: o.name || '',
        geom: o.geometry && o.geometry.type,
        inBoard,
        isSpace: o === spaceMesh
      });
    });
    return {
      meshes,
      hasSpace: meshes.some((m) => m.isSpace),
      hasGround: meshes.some((m) => !m.inBoard && !m.isSpace)
    };
  },
  step(seconds) {
    let t = seconds;
    const frameDt = 1 / 60;
    while (t > 0) {
      const dt = Math.min(frameDt, t);
      updateTiltTargets(dt);
      tilt.x = damp(tilt.x, tilt.tx, 11, dt);
      tilt.z = damp(tilt.z, tilt.tz, 11, dt);
      board.rotation.x = tilt.x;
      board.rotation.z = tilt.z;
      glassUniforms.uLightDir.value.copy(key.position).normalize();
      tmpAxis.set(1, 0, 0).applyQuaternion(board.quaternion);
      glassUniforms.uBoardX.value.copy(tmpAxis);
      tmpAxis.set(0, 0, 1).applyQuaternion(board.quaternion);
      glassUniforms.uBoardZ.value.copy(tmpAxis);
      if (spawn.active) finishSpawn();
      if (fall.active) {
        updateFall(dt);
      } else if (playing && !won) {
        let acc = dt;
        while (acc > 0) {
          const s = Math.min(SUB_DT, acc);
          physicsStep(s);
          physSteps++;
          acc -= s;
        }
        if (!fall.active) {
          pos.y = RADIUS;
          ball.position.copy(pos);
          if (contactShadow) contactShadow.position.set(pos.x, 0.003, pos.z);
          elapsed += dt;
          checkWin();
        }
      }
      t -= dt;
    }
  }
};
</script>
